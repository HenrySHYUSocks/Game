  ctx.beginPath();
  ctx.moveTo(cx - s*1.5, cy + s*1);
  ctx.lineTo(cx - s*5, cy + s*4*dir - wingFlap);
  ctx.lineTo(cx - s*4, cy + s*5.5*dir - wingFlap);
  ctx.lineTo(cx - s*0.5, cy + s*2);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + s*1.5, cy + s*1);
  ctx.lineTo(cx + s*5, cy + s*4*dir + wingFlap);
  ctx.lineTo(cx + s*4, cy + s*5.5*dir + wingFlap);
  ctx.lineTo(cx + s*0.5, cy + s*2);
  ctx.closePath();
  ctx.fill();
  // Oval body
  ctx.fillStyle = shadeColor(color, -10);
  ctx.beginPath();
  ctx.ellipse(cx, cy, s*3.5, s*3, 0, 0, Math.PI*2);
  ctx.fill();
  // Segmented body detail
  ctx.strokeStyle = shadeColor(color, -40);
  ctx.lineWidth = s*0.4;
  ctx.beginPath(); ctx.moveTo(cx - s*3, cy); ctx.lineTo(cx + s*3, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - s*2.5, cy + s*1.5); ctx.lineTo(cx + s*2.5, cy + s*1.5); ctx.stroke();
  // Head
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(cx, cy - s*2.5*dir, s*2, s*1.5, 0, 0, Math.PI*2);
  ctx.fill();
  // Mandibles
  ctx.strokeStyle = '#ddbb88';
  ctx.lineWidth = s*0.7;
  ctx.beginPath();
  ctx.moveTo(cx - s*1, cy - s*3*dir);
  ctx.lineTo(cx - s*2, cy - s*5*dir);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + s*1, cy - s*3*dir);
  ctx.lineTo(cx + s*2, cy - s*5*dir);
  ctx.stroke();
  // Eyes
  ctx.fillStyle = '#ffaa00';
  ctx.beginPath(); ctx.arc(cx - s*0.8, cy - s*3*dir, s*0.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*0.8, cy - s*3*dir, s*0.5, 0, Math.PI*2); ctx.fill();
}

// ========== AIR UNITS ==========

function drawVikingUnit(cx, cy, r, dir, color, anim) {
  const s = r / 10;
  // Wings (swept back)
  ctx.fillStyle = shadeColor(color, -30);
  ctx.beginPath();
  ctx.moveTo(cx, cy - s*2*dir);
  ctx.lineTo(cx - s*9, cy + s*6*dir);
  ctx.lineTo(cx - s*7, cy + s*7*dir);
  ctx.lineTo(cx, cy + s*2*dir);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx, cy - s*2*dir);
  ctx.lineTo(cx + s*9, cy + s*6*dir);
  ctx.lineTo(cx + s*7, cy + s*7*dir);
  ctx.lineTo(cx, cy + s*2*dir);
  ctx.closePath(); ctx.fill();
  // Fuselage
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(cx, cy, s*3, s*5, 0, 0, Math.PI*2);
  ctx.fill();
  // Cockpit
  ctx.fillStyle = '#88ddff';
  ctx.beginPath(); ctx.arc(cx, cy - s*3*dir, s*1.5, 0, Math.PI*2); ctx.fill();
  // Engine glow
  ctx.fillStyle = 'rgba(100,200,255,0.5)';
  ctx.beginPath(); ctx.arc(cx - s*3, cy + s*5*dir, s*1.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*3, cy + s*5*dir, s*1.5, 0, Math.PI*2); ctx.fill();
}

function drawMedivacUnit(cx, cy, r, dir, color, anim) {
  const s = r / 10;
  // Main body (transport hull)
  ctx.fillStyle = '#ccddee';
  ctx.beginPath();
  ctx.ellipse(cx, cy, s*5, s*4, 0, 0, Math.PI*2);
  ctx.fill();
  // Red cross
  ctx.fillStyle = '#ff2222';
  ctx.fillRect(cx - s*0.5, cy - s*2, s*1, s*4);
  ctx.fillRect(cx - s*2, cy - s*0.5, s*4, s*1);
  // Rotors
  const rotAngle = anim * 10;
  ctx.strokeStyle = 'rgba(200,200,200,0.6)';
  ctx.lineWidth = s*0.8;
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(rotAngle)*s*6, cy + Math.sin(rotAngle)*s*3);
  ctx.lineTo(cx - Math.cos(rotAngle)*s*6, cy - Math.sin(rotAngle)*s*3);
  ctx.stroke();
  // Tail
  ctx.fillStyle = shadeColor(color, -20);
  ctx.fillRect(cx - s*1, cy + s*3*dir, s*2, s*4*dir);
}

function drawBattlecruiserUnit(cx, cy, r, dir, color, anim) {
  const s = r / 16;
  // Main hull (large)
  ctx.fillStyle = shadeColor(color, -20);
  ctx.beginPath();
  ctx.moveTo(cx, cy - s*10*dir);
  ctx.lineTo(cx + s*8, cy);
  ctx.lineTo(cx + s*6, cy + s*8*dir);
  ctx.lineTo(cx - s*6, cy + s*8*dir);
  ctx.lineTo(cx - s*8, cy);
  ctx.closePath(); ctx.fill();
  // Bridge
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(cx, cy - s*2*dir, s*5, s*4, 0, 0, Math.PI*2);
  ctx.fill();
  // Cannons
  ctx.fillStyle = '#556677';
  ctx.fillRect(cx - s*7, cy - s*1, s*3, -s*6*dir);
  ctx.fillRect(cx + s*4, cy - s*1, s*3, -s*6*dir);
  // Engine glow
  ctx.fillStyle = 'rgba(255,150,50,0.6)';
  ctx.beginPath(); ctx.arc(cx - s*3, cy + s*8*dir, s*2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*3, cy + s*8*dir, s*2, 0, Math.PI*2); ctx.fill();
  // Bridge window
  ctx.fillStyle = '#88ddff';
  ctx.beginPath(); ctx.arc(cx, cy - s*3*dir, s*2, 0, Math.PI*2); ctx.fill();
}

function drawPhoenixUnit(cx, cy, r, dir, color, anim) {
  const s = r / 9;
  // Swept wings
  ctx.fillStyle = shadeColor(color, -20);
  ctx.beginPath();
  ctx.moveTo(cx, cy - s*4*dir);
  ctx.lineTo(cx - s*8, cy + s*3*dir);
  ctx.lineTo(cx - s*6, cy + s*5*dir);
  ctx.lineTo(cx, cy + s*1*dir);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx, cy - s*4*dir);
  ctx.lineTo(cx + s*8, cy + s*3*dir);
  ctx.lineTo(cx + s*6, cy + s*5*dir);
  ctx.lineTo(cx, cy + s*1*dir);
  ctx.closePath(); ctx.fill();
  // Body
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(cx, cy, s*2.5, s*4, 0, 0, Math.PI*2);
  ctx.fill();
  // Energy core
  ctx.fillStyle = '#00ccff';
  ctx.beginPath(); ctx.arc(cx, cy, s*1.5, 0, Math.PI*2); ctx.fill();
}

function drawVoidRayUnit(cx, cy, r, dir, color, anim) {
  const s = r / 11;
  // Elongated body with prism
  ctx.fillStyle = shadeColor(color, -15);
  ctx.beginPath();
  ctx.moveTo(cx, cy - s*8*dir);
  ctx.lineTo(cx + s*5, cy + s*2*dir);
  ctx.lineTo(cx + s*3, cy + s*6*dir);
  ctx.lineTo(cx - s*3, cy + s*6*dir);
  ctx.lineTo(cx - s*5, cy + s*2*dir);
  ctx.closePath(); ctx.fill();
  // Crystal prism (front)
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx, cy - s*8*dir);
  ctx.lineTo(cx + s*2, cy - s*4*dir);
  ctx.lineTo(cx - s*2, cy - s*4*dir);
  ctx.closePath(); ctx.fill();
  // Beam emitter glow
  const beamPulse = Math.sin(anim * 6) * s;
  ctx.fillStyle = 'rgba(255,220,0,0.5)';
  ctx.beginPath(); ctx.arc(cx, cy - s*8*dir, s*2 + beamPulse, 0, Math.PI*2); ctx.fill();
  // Side panels
  ctx.fillStyle = shadeColor(color, 20);
  ctx.fillRect(cx - s*6, cy - s*1, s*2, s*4*dir);
  ctx.fillRect(cx + s*4, cy - s*1, s*2, s*4*dir);
}

function drawCarrierUnit(cx, cy, r, dir, color, anim) {
  const s = r / 15;
  // Massive hull
  ctx.fillStyle = shadeColor(color, -25);
  ctx.beginPath();
  ctx.ellipse(cx, cy, s*12, s*7, 0, 0, Math.PI*2);
  ctx.fill();
  // Upper structure
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(cx, cy - s*1*dir, s*8, s*4, 0, 0, Math.PI*2);
  ctx.fill();
  // Flight deck opening
  ctx.fillStyle = '#224400';
  ctx.beginPath();
  ctx.ellipse(cx, cy + s*2*dir, s*4, s*2, 0, 0, Math.PI*2);
  ctx.fill();
  // Pylon glow (front)
  ctx.fillStyle = 'rgba(255,200,0,0.5)';
  ctx.beginPath(); ctx.arc(cx, cy - s*5*dir, s*2, 0, Math.PI*2); ctx.fill();
  // Side fins
  ctx.fillStyle = shadeColor(color, 15);
  ctx.beginPath();
  ctx.moveTo(cx - s*10, cy); ctx.lineTo(cx - s*14, cy + s*2*dir); ctx.lineTo(cx - s*10, cy + s*3*dir);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + s*10, cy); ctx.lineTo(cx + s*14, cy + s*2*dir); ctx.lineTo(cx + s*10, cy + s*3*dir);
  ctx.closePath(); ctx.fill();
}

function drawMutaliskUnit(cx, cy, r, dir, color, anim) {
  const s = r / 9;
  // Wings (bat-like)
  const wingFlap = Math.sin(anim * 8) * s * 1.5;
  ctx.fillStyle = shadeColor(color, -25);
  ctx.beginPath();
  ctx.moveTo(cx - s*2, cy);
  ctx.quadraticCurveTo(cx - s*8, cy - wingFlap*2, cx - s*9, cy + s*4*dir + wingFlap);
  ctx.lineTo(cx - s*5, cy + s*3*dir);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + s*2, cy);
  ctx.quadraticCurveTo(cx + s*8, cy + wingFlap*2, cx + s*9, cy + s*4*dir - wingFlap);
  ctx.lineTo(cx + s*5, cy + s*3*dir);
  ctx.closePath(); ctx.fill();
  // Body
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(cx, cy, s*3, s*4, 0, 0, Math.PI*2);
  ctx.fill();
  // Tail (whip-like)
  ctx.strokeStyle = shadeColor(color, -30);
  ctx.lineWidth = s;
  ctx.beginPath();
  ctx.moveTo(cx, cy + s*3*dir);
  ctx.quadraticCurveTo(cx + Math.sin(anim*5)*s*2, cy + s*7*dir, cx + Math.sin(anim*3)*s*3, cy + s*9*dir);
  ctx.stroke();
  // Eyes
  ctx.fillStyle = '#ff6600';
  ctx.beginPath(); ctx.arc(cx - s*1, cy - s*2*dir, s*0.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*1, cy - s*2*dir, s*0.6, 0, Math.PI*2); ctx.fill();
}

function drawCorruptorUnit(cx, cy, r, dir, color, anim) {
  const s = r / 11;
  // Tentacles
  ctx.strokeStyle = shadeColor(color, -40);
  ctx.lineWidth = s*1.2;
  for (let i = 0; i < 4; i++) {
    const angle = (i/4) * Math.PI * 2;
    const wave = Math.sin(anim*4 + i)*s*2;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(angle)*s*4, cy + Math.sin(angle)*s*4);
    ctx.quadraticCurveTo(cx + Math.cos(angle)*s*7 + wave, cy + Math.sin(angle)*s*7, cx + Math.cos(angle)*s*9, cy + Math.sin(angle)*s*9 + wave);
    ctx.stroke();
  }
  // Body (armored sphere)
  ctx.fillStyle = shadeColor(color, -15);
  ctx.beginPath(); ctx.arc(cx, cy, s*5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(cx, cy, s*3.5, 0, Math.PI*2); ctx.fill();
  // Eye
  ctx.fillStyle = '#ffaa00';
  ctx.beginPath(); ctx.arc(cx, cy - s*1*dir, s*1.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(cx, cy - s*1*dir, s*0.7, 0, Math.PI*2); ctx.fill();
}

function drawBroodLordUnit(cx, cy, r, dir, color, anim) {
  const s = r / 14;
  // Large wings
  ctx.fillStyle = shadeColor(color, -30);
  const flapOff = Math.sin(anim*4)*s;
  ctx.beginPath();
  ctx.moveTo(cx - s*3, cy - s*1);
  ctx.lineTo(cx - s*12, cy + s*4*dir + flapOff);
  ctx.lineTo(cx - s*10, cy + s*7*dir + flapOff);
  ctx.lineTo(cx - s*2, cy + s*3);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + s*3, cy - s*1);
  ctx.lineTo(cx + s*12, cy + s*4*dir - flapOff);
  ctx.lineTo(cx + s*10, cy + s*7*dir - flapOff);
  ctx.lineTo(cx + s*2, cy + s*3);
  ctx.closePath(); ctx.fill();
  // Body (large bloated)
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(cx, cy, s*5, s*6, 0, 0, Math.PI*2);
  ctx.fill();
  // Broodling sac
  ctx.fillStyle = shadeColor(color, 30);
  ctx.beginPath();
  ctx.ellipse(cx, cy + s*2*dir, s*3, s*3, 0, 0, Math.PI*2);
  ctx.fill();
  // Head
  ctx.fillStyle = shadeColor(color, -10);
  ctx.beginPath();
  ctx.ellipse(cx, cy - s*5*dir, s*3, s*2, 0, 0, Math.PI*2);
  ctx.fill();
  // Eyes
  ctx.fillStyle = '#ff4400';
  ctx.beginPath(); ctx.arc(cx - s*1, cy - s*5.5*dir, s*0.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*1, cy - s*5.5*dir, s*0.6, 0, Math.PI*2); ctx.fill();
}

function drawPolygon(ctx, cx, cy, r, sides, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < sides; i++) {
    const angle = (Math.PI * 2 / sides) * i - Math.PI / 2;
    const px = cx + Math.cos(angle) * r;
    const py = cy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
}

function drawStar(ctx, cx, cy, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const angle = (Math.PI * 2 / 10) * i - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.5;
    const px = cx + Math.cos(angle) * rad;
    const py = cy + Math.sin(angle) * rad;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
}

// ---- Draw Gas Geysers ----
function drawGasGeysers() {
  if (!gasGeysers) return;
  for (const key of ['player', 'enemy']) {
    const g = gasGeysers[key];
    if (!isVisible(g.y)) continue;
    const frac = g.gas / g.maxGas;
    const size = 8 + frac * 4;
    // Green glow
    ctx.fillStyle = 'rgba(0, 200, 50, 0.15)';
    ctx.beginPath(); ctx.arc(g.x, g.y, size + 5, 0, Math.PI * 2); ctx.fill();
    // Geyser body
    ctx.fillStyle = '#227733';
    ctx.beginPath(); ctx.arc(g.x, g.y, size, 0, Math.PI * 2); ctx.fill();
    // Inner glow
    ctx.fillStyle = '#44ee66';
    ctx.beginPath(); ctx.arc(g.x, g.y, size * 0.5, 0, Math.PI * 2); ctx.fill();
    // Vent lines
    ctx.strokeStyle = '#66ff88';
    ctx.lineWidth = 1;
    const puff = Math.sin(gameTime * 3) * 3;
    ctx.beginPath(); ctx.moveTo(g.x, g.y - size); ctx.lineTo(g.x - 3, g.y - size - 8 - puff); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(g.x, g.y - size); ctx.lineTo(g.x + 3, g.y - size - 6 - puff); ctx.stroke();
    // Label
    ctx.fillStyle = '#44ee66';
    ctx.font = 'bold 7px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(Math.floor(g.gas), g.x, g.y - size - 10);
  }
}

// ---- Draw Mineral Patches ----
function drawMineralPatches() {
  const allPatches = [...mineralPatches.player, ...mineralPatches.enemy];
  for (const p of allPatches) {
    if (p.minerals <= 0) {
      // Depleted
      ctx.fillStyle = '#333';
      ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI*2); ctx.fill();
      continue;
    }
    // Crystal cluster
    const frac = p.minerals / p.maxMinerals;
    const size = 6 + frac * 6;
    // Glow
    ctx.fillStyle = 'rgba(50,150,255,0.15)';
    ctx.beginPath(); ctx.arc(p.x, p.y, size + 5, 0, Math.PI*2); ctx.fill();
    // Crystals (3 shards)
    for (let i = 0; i < 3; i++) {
      const angle = (i/3)*Math.PI*2 - Math.PI/2;
      const cx = p.x + Math.cos(angle) * size * 0.4;
      const cy = p.y + Math.sin(angle) * size * 0.4;
      ctx.fillStyle = '#4488dd';
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.fillRect(-2, -size*0.5, 4, size);
      ctx.restore();
      ctx.fillStyle = '#66aaff';
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.fillRect(-1, -size*0.4, 2, size*0.6);
      ctx.restore();
    }
    // Center glow
    ctx.fillStyle = '#88ccff';
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
    // Mineral count
    ctx.fillStyle = '#88ccff';
    ctx.font = 'bold 7px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(Math.floor(p.minerals), p.x, p.y - size - 4);
  }
}

// ---- Draw Buildings ----
function drawBuildings() {
  const allBuildings = [...playerBuildings, ...enemyBuildings];
  for (const b of allBuildings) {
    const bdef = BUILDING_DEFS[b.type];
    const isPlayer = playerBuildings.includes(b);
    const teamColor = isPlayer ? FACTION_COLORS[playerFaction].primary : FACTION_COLORS[enemyFaction].primary;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(b.x+1, b.y+2, bdef.r+2, bdef.r*0.5+1, 0, 0, Math.PI*2); ctx.fill();

    if (!b.built) {
      // Under construction - wireframe
      ctx.strokeStyle = teamColor;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.4 + (b.buildProgress / b.buildTime) * 0.4;
      roundRect(ctx, b.x - bdef.r, b.y - bdef.r*0.7, bdef.r*2, bdef.r*1.4, 3, false, true);
      // Build progress bar
      ctx.globalAlpha = 1;
      const barW = bdef.r * 2;
      ctx.fillStyle = '#111';
      ctx.fillRect(b.x - barW/2, b.y - bdef.r - 8, barW, 4);
      ctx.fillStyle = '#ffaa00';
      ctx.fillRect(b.x - barW/2, b.y - bdef.r - 8, barW * (b.buildProgress / b.buildTime), 4);
    } else {
      // Built structure
      const grad = ctx.createRadialGradient(b.x-2, b.y-2, 2, b.x, b.y, bdef.r);
      grad.addColorStop(0, shadeColor(teamColor, 20));
      grad.addColorStop(1, shadeColor(teamColor, -60));
      ctx.fillStyle = grad;
      roundRect(ctx, b.x - bdef.r, b.y - bdef.r*0.7, bdef.r*2, bdef.r*1.4, 3, true, false);
      ctx.strokeStyle = teamColor;
      ctx.lineWidth = 1.5;
      roundRect(ctx, b.x - bdef.r, b.y - bdef.r*0.7, bdef.r*2, bdef.r*1.4, 3, false, true);
      // Building name
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 6px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(bdef.name, b.x, b.y + 2);
    }
  }
}

function drawHUD() {
  // Top bar (screen-space)
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, ARENA_W, 32);

  // Row 1: Minerals | Timer | Enemy label
  // Mineral icon
  ctx.fillStyle = '#4488dd';
  ctx.fillRect(5, 4, 3, 10);
  ctx.fillStyle = '#66aaff';
  ctx.fillRect(6, 6, 2, 6);
  ctx.fillStyle = '#88ccff';
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(Math.floor(playerMinerals), 12, 13);

  // Gas icon + count
  ctx.fillStyle = '#227733';
  ctx.beginPath(); ctx.arc(65, 9, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#44ee66';
  ctx.beginPath(); ctx.arc(65, 9, 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#44ee66';
  ctx.font = 'bold 10px monospace';
  ctx.fillText(Math.floor(playerGas), 72, 13);

  // Supply
  ctx.fillStyle = '#ffaa44';
  ctx.font = 'bold 9px monospace';
  ctx.fillText(`${playerSupply}/${playerSupplyMax}`, 5, 26);

  // Timer
  const remaining = Math.max(0, 600 - gameTime);
  const min = Math.floor(remaining / 60);
  const sec = Math.floor(remaining % 60);
  ctx.fillStyle = remaining < 60 ? '#ff4444' : '#fff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 11px monospace';
  ctx.fillText(`${min}:${sec < 10 ? '0' : ''}${sec}`, ARENA_W / 2, 13);

  // Enemy label
  ctx.fillStyle = FACTION_COLORS[enemyFaction].primary;
  ctx.textAlign = 'right';
  ctx.font = 'bold 9px monospace';
  ctx.fillText('vs ' + enemyFaction.toUpperCase(), ARENA_W - 4, 13);

  // Worker count
  const workerCount = units.filter(u => !u.dead && u.team === 'player' && u.worker).length;
  ctx.fillStyle = '#aaa';
  ctx.textAlign = 'left';
  ctx.font = '9px monospace';
  ctx.fillText(`Workers: ${workerCount}`, 5, VIEWPORT_H - 4);

  // Per-building production indicators
  let qy = VIEWPORT_H - 16;
  for (const b of playerBuildings) {
    if (!b.queue || b.queue.length === 0 || !b.built) continue;
    const q = b.queue[0];
    const frac = 1 - q.timeLeft / q.totalTime;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(5, qy, 80, 10);
    ctx.fillStyle = '#ffaa00';
    ctx.fillRect(5, qy, 80 * frac, 10);
    ctx.fillStyle = '#fff';
    ctx.font = '7px monospace';
    ctx.textAlign = 'left';
    const uname = UNIT_DEFS[q.type] ? UNIT_DEFS[q.type].name : q.type;
    ctx.fillText(`${uname}`, 7, qy + 8);
    qy -= 12;
    if (qy < VIEWPORT_H - 50) break;
  }
}

// ---- Right Side Production Panel ----
const BTN_H = 36;
const BTN_W = PANEL_W - 8;

let panelScroll = 0;

function drawProductionPanel() {
  const px = ARENA_W;
  // Panel background
  ctx.fillStyle = 'rgba(5,5,20,0.92)';
  ctx.fillRect(px, 0, PANEL_W, VIEWPORT_H);
  ctx.strokeStyle = '#334';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, VIEWPORT_H); ctx.stroke();

  const fc = FACTION_COLORS[playerFaction];

  // Header
  ctx.fillStyle = fc.primary;
  ctx.font = 'bold 8px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(playerFaction.toUpperCase(), px + PANEL_W/2, 12);

  // Resource display
  ctx.fillStyle = '#88ccff';
  ctx.font = 'bold 9px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(Math.floor(playerMinerals), px + 5, 24);
  ctx.fillStyle = '#44ee66';
  ctx.fillText(Math.floor(playerGas), px + 48, 24);

  let y = 32 - panelScroll;

  // Supply display
  ctx.fillStyle = '#ffcc44';
  ctx.font = 'bold 7px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(Math.floor(playerSupply) + '/' + Math.floor(playerSupplyMax), px + PANEL_W/2, y + 8);
  y += 14;

  // Per-building sections
  for (const b of playerBuildings) {
    if (y > VIEWPORT_H + 10) break;
    const bdef = BUILDING_DEFS[b.type];
    if (!bdef) continue;
    // Skip supply/gas buildings from unit production list (they don't produce units)
    if (bdef.supplyCap && b.type !== '_base') continue;
    if (bdef.gasBuilding) continue;

    if (y > -BTN_H * 4) {
      ctx.fillStyle = b.built ? fc.primary : '#666';
      ctx.font = 'bold 7px monospace';
      ctx.textAlign = 'center';
      const bname = b.type === '_base' ? 'BASE' : bdef.name.toUpperCase();
      ctx.fillText(bname, px + PANEL_W/2, y + 7);
    }
    y += 10;

    if (!b.built) {
      if (y > -20 && y < VIEWPORT_H) {
        const frac = b.buildProgress / b.buildTime;
        ctx.fillStyle = 'rgba(255,170,0,0.2)';
        ctx.fillRect(px + 4, y, BTN_W, 8);
        ctx.fillStyle = '#ffaa00';
        ctx.fillRect(px + 4, y, BTN_W * frac, 8);
        ctx.fillStyle = '#aaa';
        ctx.font = '6px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('BUILDING...', px + PANEL_W/2, y + 7);
      }
      y += 14;
      continue;
    }

    if (b.queue && b.queue.length > 0) {
      if (y > -20 && y < VIEWPORT_H) {
        const q = b.queue[0];
        const frac = 1 - q.timeLeft / q.totalTime;
        ctx.fillStyle = 'rgba(255,170,0,0.15)';
        ctx.fillRect(px + 4, y, BTN_W, 12);
        ctx.fillStyle = '#ffaa00';
        ctx.fillRect(px + 4, y + 8, BTN_W * frac, 3);
        ctx.fillStyle = '#ffcc44';
        ctx.font = '6px monospace';
        ctx.textAlign = 'center';
        const uname = UNIT_DEFS[q.type] ? UNIT_DEFS[q.type].name : q.type;
        ctx.fillText(uname + (b.queue.length > 1 ? ` +${b.queue.length-1}` : ''), px + PANEL_W/2, y + 8);
      }
      y += 14;
    }

    const producible = getProducibleUnits(b);
    for (const utype of producible) {
      if (y > VIEWPORT_H + 10) break;
      if (y > -BTN_H - 5) {
        const def = UNIT_DEFS[utype];
        const affordable = canAffordUnit(utype, 'player');
        drawPanelButton(px + 4, y, utype, def.name, def.cost, affordable, false, false);
      }
      y += BTN_H + 2;
    }

    y += 4;
    if (y > -5 && y < VIEWPORT_H) {
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.moveTo(px + 8, y); ctx.lineTo(px + PANEL_W - 8, y); ctx.stroke();
    }
    y += 4;
  }

  // Available buildings to construct
  const availBuildings = getAvailableBuildings('player');
  if (availBuildings.length > 0) {
    if (y > -20 && y < VIEWPORT_H) {
      ctx.fillStyle = '#666';
      ctx.font = 'bold 7px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('BUILD', px + PANEL_W/2, y + 6);
    }
    y += 12;
    for (const btype of availBuildings) {
      if (y > VIEWPORT_H + 10) break;
      if (y > -BTN_H - 5) {
        const bdef = BUILDING_DEFS[btype];
        const gasCost = bdef.gasCost || 0;
        const affordable = bdef.cost <= playerMinerals && playerGas >= gasCost;
        drawPanelButton(px + 4, y, btype, bdef.name, bdef.cost, affordable, false, true);
      }
      y += BTN_H + 3;
    }
  }

  // Scroll indicators
  if (panelScroll > 0) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('\u25B2', px + PANEL_W/2, 40);
  }
  if (y + panelScroll > VIEWPORT_H) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('\u25BC', px + PANEL_W/2, VIEWPORT_H - 5);
  }
}

// Get the units a specific building can produce
function getProducibleUnits(building) {
  const bdef = BUILDING_DEFS[building.type];
  if (!bdef) return [];
  if (building.type === '_base') {
    const faction = playerFaction; // this is only called for player buildings
    return [WORKER_TYPE[faction]];
  }
  return bdef.unlocks || [];
}

function drawPanelButton(bx, by, type, name, cost, affordable, selected, isBuilding) {
  // Button background
  const fc = FACTION_COLORS[playerFaction];
  if (selected) {
    ctx.fillStyle = fc.primary;
    ctx.shadowColor = fc.primary;
    ctx.shadowBlur = 6;
  } else if (affordable) {
    ctx.fillStyle = shadeColor(fc.dark, -10);
  } else {
    ctx.fillStyle = '#111';
  }
  roundRect(ctx, bx, by, BTN_W, BTN_H, 4, true, false);
  ctx.shadowBlur = 0;

  // Border
  ctx.strokeStyle = selected ? '#fff' : (affordable ? fc.primary : '#333');
  ctx.lineWidth = selected ? 1.5 : 0.5;
  roundRect(ctx, bx, by, BTN_W, BTN_H, 4, false, true);

  // Unit/building preview
  if (!isBuilding) {
    const def = UNIT_DEFS[type];
    const iconX = bx + 16;
    const iconY = by + BTN_H/2;
    ctx.save();
    ctx.beginPath(); ctx.arc(iconX, iconY, 11, 0, Math.PI*2); ctx.clip();
    const col = affordable ? def.color : '#555';
    drawSC2Unit(type, iconX, iconY, Math.min(def.r, 8), -1, col, 'player', gameTime*3);
    ctx.restore();
  } else {
    // Building icon (simple rect)
    const iconX = bx + 16;
    const iconY = by + BTN_H/2;
    ctx.fillStyle = affordable ? fc.primary : '#555';
    roundRect(ctx, iconX - 8, iconY - 6, 16, 12, 2, true, false);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 5px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('BLD', iconX, iconY + 2);
  }

  // Name
  ctx.fillStyle = affordable ? '#fff' : '#555';
  ctx.font = 'bold 7px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(name, bx + 30, by + 14);

  // Cost (minerals + gas)
  ctx.fillStyle = affordable ? '#88ccff' : '#444';
  ctx.font = 'bold 7px monospace';
  ctx.fillText(cost, bx + 30, by + 26);
  const gasCost = isBuilding ? (BUILDING_DEFS[type].gasCost || 0) : (UNIT_DEFS[type].gasCost || 0);
  if (gasCost > 0) {
    ctx.fillStyle = affordable ? '#44ee66' : '#444';
    ctx.fillText('/' + gasCost, bx + 52, by + 26);
  }

  // Supply cost (for units)
  if (!isBuilding) {
    const def = UNIT_DEFS[type];
    ctx.fillStyle = affordable ? '#ffaa44' : '#444';
    ctx.font = '6px monospace';
    ctx.fillText(`s${(def.supply||1)*def.count}`, bx + (gasCost > 0 ? 72 : 55), by + 26);
  } else {
    const btime = BUILDING_DEFS[type].buildTime;
    ctx.fillStyle = affordable ? '#888' : '#444';
    ctx.font = '6px monospace';
    ctx.fillText(`${btime}s`, bx + (gasCost > 0 ? 72 : 55), by + 26);
  }
}

// ---- Minimap ----
function drawMinimap() {
  const mmW = 50, mmH = 100;
  const mmX = ARENA_W - mmW - 5;
  const mmY = VIEWPORT_H - mmH - 5;
  const scaleX = mmW / ARENA_W;
  const scaleY = mmH / GAME_H;

  // Background
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(mmX, mmY, mmW, mmH);
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  ctx.strokeRect(mmX, mmY, mmW, mmH);

  // River
  ctx.fillStyle = 'rgba(0,100,200,0.5)';
  ctx.fillRect(mmX, mmY + RIVER_Y * scaleY, mmW, 2);

  // Towers
  for (const key of ['left', 'right', 'base']) {
    if (towers.player[key].hp > 0) {
      ctx.fillStyle = '#4488ff';
      ctx.fillRect(mmX + towers.player[key].x * scaleX - 1, mmY + towers.player[key].y * scaleY - 1, 3, 3);
    }
    if (towers.enemy[key].hp > 0) {
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(mmX + towers.enemy[key].x * scaleX - 1, mmY + towers.enemy[key].y * scaleY - 1, 3, 3);
    }
  }

  // Units as dots
  for (const u of units) {
    if (u.dead) continue;
    ctx.fillStyle = u.team === 'player' ? '#88ff88' : '#ff8888';
    ctx.fillRect(mmX + u.x * scaleX, mmY + u.y * scaleY, 1.5, 1.5);
  }

  // Viewport indicator
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.strokeRect(mmX, mmY + cameraY * scaleY, mmW, VIEWPORT_H * scaleY);
}

function roundRect(ctx, x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

// ---- Touch / Input ----
function gameToCanvas(tx, ty) {
  const rect = canvas.getBoundingClientRect();
  const cx = (tx - rect.left) / SCALE;
  const cy = (ty - rect.top) / SCALE;
  return { x: cx, y: cy };
}

// Get the list of panel buttons for hit testing (mirrors drawProductionPanel layout)
function getPanelButtons() {
  const px = ARENA_W;
  const buttons = [];
  let y = 32 - panelScroll;

  // Supply display (no buttons)
  y += 14;

  // Per-building sections
  for (const b of playerBuildings) {
    if (y > VIEWPORT_H + 10) break;
    const bdef = BUILDING_DEFS[b.type];
    if (!bdef) continue;
    if (bdef.supplyCap && b.type !== '_base') continue;
    if (bdef.gasBuilding) continue;

    y += 10;

    if (!b.built) {
      y += 14;
      continue;
    }

    if (b.queue && b.queue.length > 0) {
      y += 14;
    }

    const producible = getProducibleUnits(b);
    for (const utype of producible) {
      if (y > VIEWPORT_H + 10) break;
      buttons.push({ type: utype, x: px + 4, y, isBuilding: false, building: b });
      y += BTN_H + 2;
    }

    y += 4 + 4;
  }

  // Available buildings to construct
  const availBuildings = getAvailableBuildings('player');
  if (availBuildings.length > 0) {
    y += 12;
    for (const btype of availBuildings) {
      if (y > VIEWPORT_H + 10) break;
      buttons.push({ type: btype, x: px + 4, y, isBuilding: true });
      y += BTN_H + 3;
    }
  }

  return buttons;
}

function handleInput(x, y) {
  if (!gameRunning) return;

  // Check panel buttons
  const buttons = getPanelButtons();
  for (const btn of buttons) {
    const bw = btn.w || BTN_W;
    const bh = btn.h || BTN_H;
    if (x >= btn.x && x <= btn.x + bw && y >= btn.y && y <= btn.y + bh) {
      if (btn.isStance) return; // no longer used
      // Building construction
      if (btn.isBuilding) {
        const bdef = BUILDING_DEFS[btn.type];
        const gasCost = bdef.gasCost || 0;
        if (bdef.cost <= playerMinerals && playerGas >= gasCost) {
          playerMinerals -= bdef.cost;
          playerGas -= gasCost;
          // Gas buildings go on geyser, others near base
          let bx, baseY;
          if (bdef.gasBuilding) {
            bx = gasGeysers.player.x;
            baseY = gasGeysers.player.y;
          } else {
            baseY = GAME_H - 160;
            bx = 50 + playerBuildings.length * 35;
          }
          playerBuildings.push({
            type: btn.type,
            x: bx, y: baseY,
            hp: 500, maxHp: 500,
            built: false, buildProgress: 0, buildTime: bdef.buildTime,
            queue: [],
          });
        }
        return;
      }
      // Unit production — check supply + gas
      const def = UNIT_DEFS[btn.type];
      if (def && canAffordUnit(btn.type, 'player')) {
        const building = btn.building || getBuildingForUnit(btn.type, playerBuildings);
        if (building && building.queue.length < 5) {
          playerMinerals -= def.cost;
          playerGas -= (def.gasCost || 0);
          building.queue.push({ type: btn.type, timeLeft: def.buildTime, totalTime: def.buildTime });
        }
      }
      return;
    }
  }

  // Click on minimap to jump camera
  const mmW = 50, mmH = 100;
  const mmX = ARENA_W - mmW - 5;
  const mmY = VIEWPORT_H - mmH - 5;
  if (x >= mmX && x <= mmX + mmW && y >= mmY && y <= mmY + mmH) {
    const clickFrac = (y - mmY) / mmH;
    cameraY = clickFrac * GAME_H - VIEWPORT_H / 2;
    cameraY = Math.max(0, Math.min(GAME_H - VIEWPORT_H, cameraY));
    cameraAutoFollow = false;
    return;
  }

  // Click on arena = set army rally point (convert screen Y to world Y)
  if (x < ARENA_W) {
    const worldY = y + cameraY;
    playerRallyY = Math.max(30, Math.min(GAME_H - 30, worldY));
  }
}

// Touch/mouse input with drag-to-scroll
let touchStartX = 0, touchStartY = 0, touchMoved = false;
let panelTouchStartY = 0, panelTouchMoved = false;

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (!gameRunning) return;
  const touch = e.touches[0];
  const { x, y } = gameToCanvas(touch.clientX, touch.clientY);
  touchStartX = x;
  touchStartY = y;
  touchMoved = false;

  // Check if touching panel for panel scroll
  if (x >= ARENA_W) {
    panelTouchStartY = y;
    panelTouchMoved = false;
  } else {
    cameraDragging = true;
    cameraDragLastY = y;
    cameraAutoFollow = false;
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!gameRunning) return;
  const touch = e.touches[0];
  const { x, y } = gameToCanvas(touch.clientX, touch.clientY);
  const dx = x - touchStartX;
  const dy = y - touchStartY;

  if (Math.abs(dy) > 5) touchMoved = true;

  if (x >= ARENA_W) {
    // Panel scroll
    const panelDy = y - panelTouchStartY;
    if (Math.abs(panelDy) > 3) {
      panelScroll -= (y - panelTouchStartY);
      panelScroll = Math.max(0, panelScroll);
      panelTouchStartY = y;
      panelTouchMoved = true;
    }
  } else if (cameraDragging) {
    const dragDy = y - cameraDragLastY;
    cameraY -= dragDy;
    cameraY = Math.max(0, Math.min(GAME_H - VIEWPORT_H, cameraY));
    cameraDragLastY = y;
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (!gameRunning) return;
  cameraDragging = false;
  if (!touchMoved && !panelTouchMoved) {
    handleInput(touchStartX, touchStartY);
  }
  // Double-tap base areas to snap camera
  panelTouchMoved = false;
}, { passive: false });

let mouseDown = false, mouseStartY = 0, mouseStartX = 0, mouseMoved = false;
canvas.addEventListener('mousedown', (e) => {
  if (!gameRunning) return;
  const { x, y } = gameToCanvas(e.clientX, e.clientY);
  mouseDown = true;
  mouseStartX = x;
  mouseStartY = y;
  mouseMoved = false;
  if (x < ARENA_W) {
    cameraDragging = true;
    cameraDragLastY = y;
    cameraAutoFollow = false;
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (!mouseDown || !gameRunning) return;
  const { x, y } = gameToCanvas(e.clientX, e.clientY);
  if (Math.abs(y - mouseStartY) > 5) mouseMoved = true;
  if (cameraDragging && mouseStartX < ARENA_W) {
    cameraY -= (y - cameraDragLastY);
    cameraY = Math.max(0, Math.min(GAME_H - VIEWPORT_H, cameraY));
    cameraDragLastY = y;
  } else if (mouseStartX >= ARENA_W) {
    // Panel scroll with mouse drag
    panelScroll -= (y - cameraDragLastY);
    panelScroll = Math.max(0, panelScroll);
    cameraDragLastY = y;
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (!gameRunning) return;
  cameraDragging = false;
  if (!mouseMoved) {
    const { x, y } = gameToCanvas(e.clientX, e.clientY);
    handleInput(x, y);
  }
  mouseDown = false;
  mouseMoved = false;
});

// Mouse wheel for camera + panel scroll
canvas.addEventListener('wheel', (e) => {
  if (!gameRunning) return;
  e.preventDefault();
  const { x } = gameToCanvas(e.clientX, e.clientY);
  if (x >= ARENA_W) {
    panelScroll += e.deltaY * 0.5;
    panelScroll = Math.max(0, panelScroll);
  } else {
    cameraY += e.deltaY * 0.5;
    cameraY = Math.max(0, Math.min(GAME_H - VIEWPORT_H, cameraY));
    cameraAutoFollow = false;
  }
}, { passive: false });

// ---- Game Loop ----
let lastTime = 0;

function gameLoop(timestamp) {
  if (!gameRunning) return;

  const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
  lastTime = timestamp;

  updateGame(dt);
  render();

  requestAnimationFrame(gameLoop);
}

// Initialize defaults for initial render
mineralPatches = makeMineralPatches();
gasGeysers = makeGasGeysers();
towers = makeTowers();

// Initial render
render();
</script>
