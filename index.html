<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>StarClash - StarCraft Mobile Arena</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
canvas { display: block; }
#gameContainer {
  width: 100%; height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}
#menuScreen, #factionScreen, #gameOverScreen {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  z-index: 10;
}
#menuScreen { background: linear-gradient(180deg, #0a0a2e 0%, #1a0a3e 50%, #0a0a2e 100%); }
#factionScreen { background: linear-gradient(180deg, #0a0a2e 0%, #1a0a3e 50%, #0a0a2e 100%); display: none; }
#gameOverScreen { background: rgba(0,0,0,0.85); display: none; }
.title {
  font-size: 2.5em; color: #00d4ff;
  text-shadow: 0 0 20px #00d4ff, 0 0 40px #0066ff;
  margin-bottom: 10px; font-weight: bold;
  letter-spacing: 3px;
}
.subtitle {
  font-size: 1em; color: #8888cc;
  margin-bottom: 40px; letter-spacing: 2px;
}
.menuBtn {
  background: linear-gradient(180deg, #1a3a6a, #0a1a3a);
  border: 2px solid #00d4ff;
  color: #00d4ff; padding: 15px 50px;
  font-size: 1.2em; border-radius: 8px;
  margin: 8px; cursor: pointer;
  text-shadow: 0 0 10px #00d4ff;
  transition: all 0.2s;
  min-width: 220px; text-align: center;
}
.menuBtn:active { background: #00d4ff; color: #000; }
.factionCard {
  background: linear-gradient(180deg, #1a2a4a, #0a1a2a);
  border: 2px solid #446;
  border-radius: 12px; padding: 20px;
  margin: 10px; cursor: pointer;
  width: 85%; max-width: 300px;
  text-align: center; transition: all 0.2s;
}
.factionCard:active { border-color: #00d4ff; transform: scale(1.03); }
.factionCard h3 { font-size: 1.3em; margin-bottom: 5px; }
.factionCard p { font-size: 0.8em; color: #888; }
.fc-terran h3 { color: #4488ff; }
.fc-protoss h3 { color: #ffcc00; }
.fc-zerg h3 { color: #ff4444; }
.goText {
  font-size: 2em; margin-bottom: 20px;
  font-weight: bold;
}
.win { color: #00ff88; text-shadow: 0 0 20px #00ff88; }
.lose { color: #ff4444; text-shadow: 0 0 20px #ff4444; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="menuScreen">
    <div class="title">STARCLASH</div>
    <div class="subtitle">MOBILE ARENA</div>
    <div class="menuBtn" onclick="showFactionSelect()">BATTLE</div>
  </div>
  <div id="factionScreen">
    <div class="title" style="font-size:1.5em; margin-bottom:20px;">CHOOSE YOUR RACE</div>
    <div class="factionCard fc-terran" onclick="startGame('terran')">
      <h3>TERRAN</h3>
      <p>Versatile human forces. Marines, Siege Tanks, Medics.</p>
    </div>
    <div class="factionCard fc-protoss" onclick="startGame('protoss')">
      <h3>PROTOSS</h3>
      <p>Powerful psionic warriors. Zealots, Stalkers, High Templar.</p>
    </div>
    <div class="factionCard fc-zerg" onclick="startGame('zerg')">
      <h3>ZERG</h3>
      <p>Overwhelming swarm. Zerglings, Roaches, Hydralisks.</p>
    </div>
  </div>
  <div id="gameOverScreen">
    <div class="goText" id="goText">VICTORY</div>
    <div class="menuBtn" onclick="showMenu()">MAIN MENU</div>
    <div class="menuBtn" onclick="showFactionSelect()">PLAY AGAIN</div>
  </div>
</div>

<script>
// ============================================================
// STARCLASH - A StarCraft x Clash Royale mobile arena game
// ============================================================

const canvas = document.getElementById('gameCanvas');

// ---- Layout ----
let W, H, SCALE;
const GAME_W = 400;
const GAME_H = 1400;
const VIEWPORT_H = 700;

function resize() {
  const ratio = GAME_W / VIEWPORT_H;
  if (window.innerWidth / window.innerHeight > ratio) {
    H = window.innerHeight;
    W = H * ratio;
  } else {
    W = window.innerWidth;
    H = W / ratio;
  }
  canvas.width = W;
  canvas.height = H;
  SCALE = W / GAME_W;
}
window.addEventListener('resize', resize);
resize();

// ---- Supply System ----

let enemySupply = 0;
let enemySupplyMax = 10;

// ---- Force Fields ----
let forceFields = [];

// 3 mineral patches per side + 1 gas geyser per side

      { x: 50,  y: GAME_H - 100, minerals: 5000, maxMinerals: 5000 },

  spire:     { faction:'zerg', cost:150, gasCost:100, buildTime:10, name:'Spire', unlocks:['mutalisk','corruptor','broodlord'], requires:'den', r:18 },

const FACTION_SUPPLY = { terran:'supplydepot', protoss:'pylon', zerg:'overlord' };
const FACTION_GAS = { terran:'refinery', protoss:'assimilator', zerg:'extractor' };

const FACTION_BUILDINGS = {
  terran: ['supplydepot','refinery','barracks','factory','starport'],
  protoss: ['pylon','assimilator','gateway','robo','fleetbeacon'],
  zerg: ['overlord','extractor','pool','den','spire'],
};

let playerBuildings = []; // { type, x, y, hp, maxHp, built, buildProgress, buildTime }
let enemyBuildings = [];

// ---- Unit Definitions ----
const UNIT_DEFS = {
  // TERRAN
  marine:       { faction:'terran', cost:50,  gasCost:0,   supply:1, hp:250, dmg:35, speed:1.3, range:120, atkSpeed:0.8, count:3, r:8,  color:'#4488ff', name:'Marine', buildTime:3 },
  marauder:     { faction:'terran', cost:100, gasCost:25,  supply:2, hp:450, dmg:55, speed:1.0, range:90,  atkSpeed:1.0, count:2, r:10, color:'#336699', name:'Marauder', buildTime:4 },
  medic:        { faction:'terran', cost:75,  gasCost:25,  supply:2, hp:200, dmg:0,  speed:1.2, range:100, atkSpeed:1.5, count:2, r:8,  color:'#88ccff', name:'Medic', healer:true, healAmt:40, buildTime:3 },
  siegetank:    { faction:'terran', cost:200, gasCost:100, supply:3, hp:600, dmg:120,speed:0.5, range:160, atkSpeed:2.0, count:1, r:14, color:'#2255aa', name:'Siege Tank', splash:30, buildTime:6 },
  ghost:        { faction:'terran', cost:175, gasCost:125, supply:2, hp:350, dmg:80, speed:1.1, range:140, atkSpeed:1.2, count:1, r:9,  color:'#aaccff', name:'Ghost', buildTime:5 },
  scv:          { faction:'terran', cost:50,  gasCost:0,   supply:1, hp:200, dmg:0,  speed:1.0, range:0,   atkSpeed:0,   count:1, r:8,  color:'#88aadd', name:'SCV', worker:true, mineRate:0.3, buildTime:2 },
  viking:       { faction:'terran', cost:150, gasCost:75,  supply:2, hp:280, dmg:40, speed:1.3, range:120, atkSpeed:0.9, count:1, r:10, color:'#5599ee', name:'Viking', buildTime:5, isAir:true },
  medivac:      { faction:'terran', cost:100, gasCost:100, supply:2, hp:200, dmg:0,  speed:1.4, range:100, atkSpeed:1.5, count:1, r:10, color:'#aaddff', name:'Medivac', healer:true, healAmt:30, buildTime:5, isAir:true },
  battlecruiser:{ faction:'terran', cost:400, gasCost:300, supply:6, hp:800, dmg:70, speed:0.6, range:130, atkSpeed:1.0, count:1, r:16, color:'#3366aa', name:'Battlecruiser', splash:20, buildTime:10, isAir:true },
  // PROTOSS
  zealot:       { faction:'protoss', cost:75,  gasCost:0,   supply:1, hp:420, dmg:50, speed:1.4, range:20,  atkSpeed:0.7, count:2, r:10, color:'#ffcc00', name:'Zealot', buildTime:3 },
  stalker:      { faction:'protoss', cost:115, gasCost:50,  supply:2, hp:350, dmg:45, speed:1.2, range:130, atkSpeed:0.9, count:2, r:9,  color:'#cc9900', name:'Stalker', buildTime:4 },
  sentry:       { faction:'protoss', cost:100, gasCost:50,  supply:2, hp:250, dmg:25, speed:1.0, range:110, atkSpeed:1.0, count:2, r:8,  color:'#ffee88', name:'Sentry', shield:true, shieldAmt:100, buildTime:3 },
  hightemplar:  { faction:'protoss', cost:200, gasCost:150, supply:3, hp:280, dmg:150,speed:0.7, range:130, atkSpeed:2.5, count:1, r:9,  color:'#ffff00', name:'High Templar', splash:50, buildTime:6 },
  immortal:     { faction:'protoss', cost:175, gasCost:100, supply:3, hp:600, dmg:70, speed:0.8, range:100, atkSpeed:1.2, count:1, r:13, color:'#ddaa00', name:'Immortal', buildTime:5 },
  probe:        { faction:'protoss', cost:50,  gasCost:0,   supply:1, hp:180, dmg:0,  speed:1.0, range:0,   atkSpeed:0,   count:1, r:8,  color:'#ddcc44', name:'Probe', worker:true, mineRate:0.3, buildTime:2 },
  phoenix:      { faction:'protoss', cost:150, gasCost:100, supply:2, hp:250, dmg:35, speed:1.6, range:110, atkSpeed:0.8, count:1, r:9,  color:'#eebb22', name:'Phoenix', buildTime:5, isAir:true },
  voidray:      { faction:'protoss', cost:250, gasCost:150, supply:3, hp:300, dmg:50, speed:0.9, range:130, atkSpeed:1.2, count:1, r:11, color:'#ffdd44', name:'Void Ray', buildTime:7, isAir:true },
  carrier:      { faction:'protoss', cost:350, gasCost:250, supply:6, hp:600, dmg:40, speed:0.7, range:150, atkSpeed:0.5, count:1, r:15, color:'#ddaa00', name:'Carrier', buildTime:10, isAir:true },
  // ZERG
  zergling:     { faction:'zerg', cost:50,  gasCost:0,   supply:1, hp:170, dmg:27, speed:2.0, range:18,  atkSpeed:0.5, count:7, r:6,  color:'#ff4444', name:'Zergling', buildTime:2 },
  roach:        { faction:'zerg', cost:75,  gasCost:25,  supply:2, hp:500, dmg:35, speed:1.0, range:80,  atkSpeed:0.8, count:2, r:10, color:'#aa3333', name:'Roach', buildTime:3 },
  hydralisk:    { faction:'zerg', cost:125, gasCost:25,  supply:2, hp:350, dmg:50, speed:1.1, range:130, atkSpeed:0.8, count:2, r:9,  color:'#ff6666', name:'Hydralisk', buildTime:4 },
  baneling:     { faction:'zerg', cost:75,  gasCost:25,  supply:2, hp:120, dmg:200,speed:1.8, range:15,  atkSpeed:0.1, count:3, r:7,  color:'#44ff44', name:'Baneling', suicide:true, splash:35, buildTime:3 },
  ultralisk:    { faction:'zerg', cost:300, gasCost:200, supply:6, hp:900, dmg:80, speed:0.9, range:22,  atkSpeed:1.0, count:1, r:16, color:'#cc2222', name:'Ultralisk', splash:25, buildTime:8 },
  drone:        { faction:'zerg', cost:50,  gasCost:0,   supply:1, hp:160, dmg:0,  speed:1.0, range:0,   atkSpeed:0,   count:1, r:8,  color:'#dd6644', name:'Drone', worker:true, mineRate:0.3, buildTime:2 },
  mutalisk:     { faction:'zerg', cost:100, gasCost:100, supply:2, hp:200, dmg:30, speed:1.8, range:90,  atkSpeed:0.7, count:1, r:9,  color:'#ee5555', name:'Mutalisk', splash:15, buildTime:5, isAir:true },
  corruptor:    { faction:'zerg', cost:150, gasCost:100, supply:2, hp:350, dmg:50, speed:1.1, range:120, atkSpeed:1.0, count:1, r:11, color:'#cc3333', name:'Corruptor', buildTime:5, isAir:true },
  broodlord:    { faction:'zerg', cost:300, gasCost:250, supply:4, hp:500, dmg:60, speed:0.5, range:160, atkSpeed:2.0, count:1, r:14, color:'#aa2222', name:'Brood Lord', splash:25, buildTime:8, isAir:true },
};

// Worker type per faction
const WORKER_TYPE = { terran:'scv', protoss:'probe', zerg:'drone' };

// ---- Rally Point System ----
let playerRallyY = null; // null = hold at base, set by clicking map
let enemyStance = 'attack';

// ---- Units ----
let units = [];
let particles = [];
let projectiles = [];

// ---- Get available units for a team ----
function getAvailableUnits(team) {
  const faction = team === 'player' ? playerFaction : enemyFaction;
  const buildings = team === 'player' ? playerBuildings : enemyBuildings;
  const workerType = WORKER_TYPE[faction];
  const available = [workerType]; // workers always available
  for (const b of buildings) {
    if (!b.built) continue;
    const bdef = BUILDING_DEFS[b.type];
    if (bdef && bdef.unlocks) {
      for (const u of bdef.unlocks) available.push(u);
    }
  }
  return available;
}

function getAvailableBuildings(team) {
  const faction = team === 'player' ? playerFaction : enemyFaction;
  const buildings = team === 'player' ? playerBuildings : enemyBuildings;
  const all = FACTION_BUILDINGS[faction];
  const available = [];
  for (const btype of all) {
    const bdef = BUILDING_DEFS[btype];
    // Supply buildings can be built multiple times
    if (bdef.supplyCap) {
      available.push(btype);
      continue;
    }
    // Gas/other buildings: only one allowed
    const exists = buildings.some(b => b.type === btype);
    if (exists) continue;
    // Check prerequisite
    if (bdef.requires) {
      const hasReq = buildings.some(b => b.type === bdef.requires && b.built);
      if (!hasReq) continue;
    }
    available.push(btype);
  }
  return available;
}

// ---- Spawn Units ----
function spawnUnit(defName, x, y, team) {
  const def = UNIT_DEFS[defName];
  const spreadR = def.count > 1 ? 15 : 0;
  // Update supply
  const totalSupply = (def.supply || 1) * def.count;
  if (team === 'player') playerSupply += totalSupply;
  else enemySupply += totalSupply;

  for (let i = 0; i < def.count; i++) {
    const ox = (Math.random() - 0.5) * spreadR * 2;
    const oy = (Math.random() - 0.5) * spreadR * 2;
    const shield = def.shield ? def.shieldAmt : 0;
    units.push({
      type: defName,
      team,
      x: x + ox,
      y: y + oy,
      hp: def.hp,
      maxHp: def.hp,
      shield,
      maxShield: shield,
      dmg: def.dmg,
      speed: def.speed,
      range: def.range,
      atkSpeed: def.atkSpeed,
      atkTimer: 0,
      r: def.r,
      color: team === 'player' ? FACTION_COLORS[playerFaction].primary : FACTION_COLORS[enemyFaction].primary,
      dead: false,
      healer: def.healer || false,
      healAmt: def.healAmt || 0,
      suicide: def.suicide || false,
      splash: def.splash || 0,
      worker: def.worker || false,
      mineRate: def.mineRate || 0,
      isAir: def.isAir || false,
      target: null,
      animFrame: 0,
      // Worker mining state
      miningState: 'idle',
      miningTimer: 0,
      assignedPatch: null,
      carrying: 0,
      // Ability state
      siegeMode: false,
      siegeTimer: 0,
      chargeTimer: 0,
      blinkTimer: 0,
      empTimer: 0,
      forcefieldTimer: 0,
      voidrayDmgStage: 0,
      voidrayAttackTime: 0,
      lastTarget: null,
      supply: def.supply || 1,
    });
  }
}

// ---- Menu ----
function showMenu() {
  document.getElementById('menuScreen').style.display = 'flex';
  document.getElementById('factionScreen').style.display = 'none';
  document.getElementById('gameOverScreen').style.display = 'none';
  gameRunning = false;
}

function showFactionSelect() {
  document.getElementById('menuScreen').style.display = 'none';
  document.getElementById('factionScreen').style.display = 'flex';
  document.getElementById('gameOverScreen').style.display = 'none';
}

function startGame(faction) {
  playerFaction = faction;
  const others = FACTIONS.filter(f => f !== faction);
  enemyFaction = others[Math.floor(Math.random() * others.length)];

  document.getElementById('menuScreen').style.display = 'none';
  document.getElementById('factionScreen').style.display = 'none';
  document.getElementById('gameOverScreen').style.display = 'none';

  towers = makeTowers();
  mineralPatches = makeMineralPatches();
  gasGeysers = makeGasGeysers();
  units = [];
  particles = [];
  projectiles = [];
  forceFields = [];
  // Each side gets an implicit "base" building
  playerBuildings = [{ type: '_base', x: ARENA_W/2, y: GAME_H - 90, hp: 2400, maxHp: 2400, built: true, buildProgress: 99, buildTime: 1, queue: [] }];
  enemyBuildings = [{ type: '_base', x: ARENA_W/2, y: 90, hp: 2400, maxHp: 2400, built: true, buildProgress: 99, buildTime: 1, queue: [] }];
  playerMinerals = 50;
  enemyMinerals = 50;
  playerGas = 0;
  enemyGas = 0;
  playerSupply = 0;
  playerSupplyMax = 10;
  enemySupply = 0;
  enemySupplyMax = 10;
  gameTime = 0;
  playerRallyY = GAME_H - 250; // start holding near base
  enemyStance = 'attack';
  aiTimer = 0;
  cameraY = GAME_H - VIEWPORT_H; // Start viewing player base
  cameraAutoFollow = true;

  // Start with 4 workers each
  const pw = WORKER_TYPE[playerFaction];
  const ew = WORKER_TYPE[enemyFaction];
  for (let i = 0; i < 4; i++) {
    spawnUnit(pw, ARENA_W/2 + (Math.random()-0.5)*30, GAME_H - 110 + (Math.random()-0.5)*15, 'player');
    spawnUnit(ew, ARENA_W/2 + (Math.random()-0.5)*30, 110 + (Math.random()-0.5)*15, 'enemy');
  }

  gameRunning = true;
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

// ---- Find Target ----
function dist(a, b) {
  return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
}

function findNearestPatch(unit) {
  const patches = unit.team === 'player' ? mineralPatches.player : mineralPatches.enemy;
  let best = null, bestD = Infinity;
  for (const p of patches) {
    if (p.minerals <= 0) continue;
    const d = dist(unit, p);
    if (d < bestD) { bestD = d; best = p; }
  }
  return best;
}

function findTarget(unit) {
  const isPlayer = unit.team === 'player';
  // Player units near rally point use limited engagement range; enemy AI always full range
  const nearRally = isPlayer && playerRallyY !== null && Math.abs(unit.y - playerRallyY) < 80;
  const maxRange = (!unit.worker && nearRally) ? 200 : Infinity;
  let best = null;
  let bestDist = Infinity;

  for (const u of units) {
    if (u.dead || u.team === unit.team) continue;
    if (unit.healer) continue;
    const d = dist(unit, u);
    if (d < bestDist && d < maxRange) { bestDist = d; best = u; }
  }

  if (unit.healer) {
    bestDist = Infinity;
    for (const u of units) {
      if (u.dead || u.team !== unit.team || u === unit || u.healer) continue;
      if (u.hp >= u.maxHp) continue;
      const d = dist(unit, u);
      if (d < bestDist) { bestDist = d; best = u; }
    }
    return best;
  }

  // Target towers/base when in combat range
  const enemyTowers = isPlayer ? towers.enemy : towers.player;
  for (const key of ['left', 'right', 'base']) {
    const t = enemyTowers[key];
    if (t.hp <= 0) continue;
    const d = dist(unit, t);
    if (d < bestDist && d < maxRange) { bestDist = d; best = t; }
  }

  return best;
}

// ---- Worker Mining Logic ----
function updateWorker(unit, dt) {
  const baseX = ARENA_W / 2;
  const baseY = unit.team === 'player' ? GAME_H - 90 : 90;
  const moveSpeed = unit.speed * 60;

  switch (unit.miningState) {
    case 'idle': {
      // Find nearest mineral patch
      const patch = findNearestPatch(unit);
      if (patch) {
        unit.assignedPatch = patch;
        unit.miningState = 'toMineral';
      }
      break;
    }
    case 'toMineral': {
      if (!unit.assignedPatch || unit.assignedPatch.minerals <= 0) {
        unit.miningState = 'idle';
        break;
      }
      const d = dist(unit, unit.assignedPatch);
      if (d < 12) {
        unit.miningState = 'mining';
        unit.miningTimer = MINE_TIME;
      } else {
        const angle = Math.atan2(unit.assignedPatch.y - unit.y, unit.assignedPatch.x - unit.x);
        unit.x += Math.cos(angle) * moveSpeed * dt;
        unit.y += Math.sin(angle) * moveSpeed * dt;
      }
      break;
    }
    case 'mining': {
      unit.miningTimer -= dt;
      // Mining sparkle
      if (Math.random() < 0.08) {
        spawnParticle(unit.x + (Math.random()-0.5)*8, unit.y + (Math.random()-0.5)*8, '#44ccff', 2);
      }
      if (unit.miningTimer <= 0) {
        const amount = Math.min(CARRY_AMOUNT, unit.assignedPatch.minerals);
        unit.assignedPatch.minerals -= amount;
        unit.carrying = amount;
        unit.miningState = 'toBase';
      }
      break;
    }
    case 'toBase': {
      const d = dist(unit, { x: baseX, y: baseY });
      if (d < 20) {
        // Deliver minerals
        if (unit.team === 'player') playerMinerals += unit.carrying;
        else enemyMinerals += unit.carrying;
        unit.carrying = 0;
        spawnParticle(unit.x, unit.y, '#44ccff', 3);
        unit.miningState = 'idle';
      } else {
        const angle = Math.atan2(baseY - unit.y, baseX - unit.x);
        unit.x += Math.cos(angle) * moveSpeed * dt;
        unit.y += Math.sin(angle) * moveSpeed * dt;
      }
      break;
    }
  }
}

// ---- Production Queue (per-building) ----
// Find which building produces a given unit type
function getBuildingForUnit(unitType, buildings) {
  const def = UNIT_DEFS[unitType];
  if (def.worker) {
    // Workers come from base
    return buildings.find(b => b.type === '_base' && b.built);
  }
  for (const b of buildings) {
    if (!b.built) continue;
    const bdef = BUILDING_DEFS[b.type];
    if (bdef && bdef.unlocks && bdef.unlocks.includes(unitType)) return b;
  }
  return null;
}

// Process all building queues for a team
function updateAllBuildingQueues(buildings, team, dt) {
  for (const b of buildings) {
    if (!b.queue || b.queue.length === 0) continue;
    if (!b.built) continue; // can't produce until built
    const item = b.queue[0];
    item.timeLeft -= dt;
    if (item.timeLeft <= 0) {
      b.queue.shift();
      // Spawn unit near the building
      const baseY = team === 'player' ? GAME_H - 150 : 150;
      const lane = Math.random() < 0.5 ? 0 : 1;
      const x = LANE_X[lane] + (Math.random()-0.5)*30;
      spawnUnit(item.type, x, baseY, team);
    }
  }
}


// ---- Update Buildings ----
function updateBuildings(buildings, team, dt) {
  for (const b of buildings) {
    if (!b.built) {
      b.buildProgress += dt;
      if (b.buildProgress >= b.buildTime) {
        b.built = true;
        // Add supply cap if supply building
        const bdef = BUILDING_DEFS[b.type];
        if (bdef && bdef.supplyCap) {
          if (team === 'player') playerSupplyMax += bdef.supplyCap;
          else enemySupplyMax += bdef.supplyCap;
        }
      }
    }
  }
}

// ---- Unit Abilities ----
function updateUnitAbilities(unit, dt) {
  // Decrement cooldown timers
  if (unit.chargeTimer > 0) unit.chargeTimer -= dt;
  if (unit.blinkTimer > 0) unit.blinkTimer -= dt;
  if (unit.empTimer > 0) unit.empTimer -= dt;
  if (unit.forcefieldTimer > 0) unit.forcefieldTimer -= dt;

  // Stalker blink: teleport backward when low HP
  if (unit.type === 'stalker' && unit.hp < unit.maxHp * 0.5 && unit.blinkTimer <= 0) {
    const blinkDir = unit.team === 'player' ? 1 : -1; // blink toward own base
    const oldX = unit.x, oldY = unit.y;
    unit.y += 60 * blinkDir;
    unit.y = Math.max(30, Math.min(GAME_H - 30, unit.y));
    unit.blinkTimer = 10;
    spawnParticle(oldX, oldY, '#4488ff', 8);
    spawnParticle(unit.x, unit.y, '#4488ff', 8);
  }

  // Ghost EMP: remove shields from nearby Protoss enemies
  if (unit.type === 'ghost' && unit.empTimer <= 0) {
    let fired = false;
    for (const u of units) {
      if (u.dead || u.team === unit.team) continue;
      if (u.maxShield > 0 && u.shield > 0 && dist(unit, u) < 140) {
        // EMP blast
        for (const t of units) {
          if (t.dead || t.team === unit.team) continue;
          if (t.maxShield > 0 && dist(u, t) < 40) {
            t.shield = 0;
            spawnParticle(t.x, t.y, '#aaddff', 5);
          }
        }
        fired = true;
        break;
      }
    }
    if (fired) unit.empTimer = 20;
  }

  // Sentry force field: drop barrier near bridge
  if (unit.type === 'sentry' && unit.forcefieldTimer <= 0) {
    let nearbyEnemies = 0;
    for (const u of units) {
      if (u.dead || u.team === unit.team || u.isAir) continue;
      if (dist(unit, u) < 100) nearbyEnemies++;
    }
    if (nearbyEnemies >= 2) {
      // Drop force field at nearest bridge
      let bestBridge = null, bestD = Infinity;
      for (const lx of LANE_X) {
        const d = dist(unit, { x: lx, y: RIVER_Y });
        if (d < bestD) { bestD = d; bestBridge = { x: lx, y: RIVER_Y }; }
      }
      if (bestBridge && bestD < 200) {
        forceFields.push({ x: bestBridge.x, y: bestBridge.y, r: 20, life: 4, maxLife: 4, team: unit.team });
        unit.forcefieldTimer = 15;
        spawnParticle(bestBridge.x, bestBridge.y, '#44aaff', 10);
      }
    }
  }
}

// ---- Supply helpers ----
function getTeamSupply(team) { return team === 'player' ? playerSupply : enemySupply; }
function getTeamSupplyMax(team) { return team === 'player' ? playerSupplyMax : enemySupplyMax; }
function canAffordUnit(defName, team) {
  const def = UNIT_DEFS[defName];
  const minerals = team === 'player' ? playerMinerals : enemyMinerals;
  const gas = team === 'player' ? playerGas : enemyGas;
  const supply = getTeamSupply(team);
  const supplyMax = getTeamSupplyMax(team);
  return minerals >= def.cost && gas >= (def.gasCost || 0) && supply + (def.supply || 1) * def.count <= supplyMax;
}

// ---- Game Logic Update ----
function updateGame(dt) {
  gameTime += dt;

  // Gas income (depletes from geyser)
  const playerHasRefinery = playerBuildings.some(b => BUILDING_DEFS[b.type] && BUILDING_DEFS[b.type].gasBuilding && b.built);
  const enemyHasRefinery = enemyBuildings.some(b => BUILDING_DEFS[b.type] && BUILDING_DEFS[b.type].gasBuilding && b.built);
  if (playerHasRefinery && gasGeysers.player.gas > 0) {
    const mined = Math.min(GAS_INCOME_RATE * dt, gasGeysers.player.gas);
    gasGeysers.player.gas -= mined;
    playerGas = Math.min(9999, playerGas + mined);
  }
  if (enemyHasRefinery && gasGeysers.enemy.gas > 0) {
    const mined = Math.min(GAS_INCOME_RATE * dt, gasGeysers.enemy.gas);
    gasGeysers.enemy.gas -= mined;
    enemyGas = Math.min(9999, enemyGas + mined);
  }

  // Update per-building production queues
  updateAllBuildingQueues(playerBuildings, 'player', dt);
  updateAllBuildingQueues(enemyBuildings, 'enemy', dt);

  // Update buildings (supply cap on complete)
  updateBuildings(playerBuildings, 'player', dt);
  updateBuildings(enemyBuildings, 'enemy', dt);

  // Update force fields
  for (const ff of forceFields) {
    ff.life -= dt;
  }
  forceFields = forceFields.filter(ff => ff.life > 0);

  // AI
  updateEnemyAI(dt);

  // Units
  for (const unit of units) {
    if (unit.dead) continue;
    unit.animFrame += dt * 5;

    // Workers mine
    if (unit.worker) {
      updateWorker(unit, dt);
      continue;
    }

    // ---- Unit Abilities ----
    updateUnitAbilities(unit, dt);

    const target = findTarget(unit);
    unit.target = target;

    // Siege tank: can't move in siege mode
    const effectiveSpeed = unit.siegeMode ? 0 : unit.speed;
    // Ultralisk frenzy: +50% attack speed below 30% HP
    let effectiveAtkSpeed = unit.atkSpeed;
    if (unit.type === 'ultralisk' && unit.hp < unit.maxHp * 0.3) {
      effectiveAtkSpeed *= 0.67;
    }
    // Void Ray: damage ramp
    let effectiveDmg = unit.dmg;
    if (unit.type === 'voidray') {
      if (target && target === unit.lastTarget) {
        unit.voidrayAttackTime += dt;
        if (unit.voidrayAttackTime > 4) effectiveDmg = 100;
        else if (unit.voidrayAttackTime > 2) effectiveDmg = 75;
      } else {
        unit.voidrayAttackTime = 0;
      }
      unit.lastTarget = target;
    }
    // Siege mode stat overrides
    let effectiveRange = unit.range;
    let effectiveSplash = unit.splash;
    if (unit.siegeMode) {
      effectiveRange = 220;
      effectiveDmg = 180;
      effectiveSplash = 40;
    }

    if (target) {
      const d = dist(unit, target);
      const targetR = target.r || 0;

      if (d - targetR <= effectiveRange) {
        unit.atkTimer -= dt;
        // Siege tank: enter siege mode when stationary and in range
        if (unit.type === 'siegetank' && !unit.siegeMode) {
          unit.siegeTimer += dt;
          if (unit.siegeTimer > 2) { unit.siegeMode = true; unit.siegeTimer = 0; }
        }

        if (unit.atkTimer <= 0) {
          unit.atkTimer = effectiveAtkSpeed;

          if (unit.healer) {
            target.hp = Math.min(target.maxHp, target.hp + unit.healAmt);
            spawnParticle(target.x, target.y, '#88ff88', 8);
          } else if (unit.suicide) {
            if (effectiveSplash > 0) {
              dealSplash(unit.x, unit.y, effectiveSplash, effectiveDmg, unit.team);
            } else {
              dealDamage(target, effectiveDmg);
            }
            spawnParticle(unit.x, unit.y, '#44ff44', 20);
            unit.hp = 0;
            unit.dead = true;
          } else {
            if (effectiveRange > 40) {
              projectiles.push({ x: unit.x, y: unit.y, tx: target.x, ty: target.y, dmg: effectiveDmg, team: unit.team, speed: 250, color: unit.color, splash: effectiveSplash, target });
            } else {
              if (effectiveSplash > 0) {
                dealSplash(target.x, target.y, effectiveSplash, effectiveDmg, unit.team);
              } else {
                dealDamage(target, effectiveDmg);
              }
              spawnParticle(target.x, target.y, '#fff', 5);
            }
          }
        }
      } else {
        // Zealot charge: burst forward
        if (unit.type === 'zealot' && d > 60 && d < 120 && unit.chargeTimer <= 0) {
          const angle = Math.atan2(target.y - unit.y, target.x - unit.x);
          unit.x += Math.cos(angle) * effectiveSpeed * 50 * 3 * dt;
          unit.y += Math.sin(angle) * effectiveSpeed * 50 * 3 * dt;
          unit.chargeTimer = 5;
          spawnParticle(unit.x, unit.y, '#ffcc00', 5);
        } else if (effectiveSpeed > 0) {
          // Check force field collision for ground units
          let blocked = false;
          if (!unit.isAir) {
            for (const ff of forceFields) {
              if (ff.team === unit.team) continue;
              if (dist(unit, ff) < ff.r + unit.r) { blocked = true; break; }
            }
          }
          if (!blocked) {
            const angle = Math.atan2(target.y - unit.y, target.x - unit.x);
            const moveSpeed = effectiveSpeed * 50;
            unit.x += Math.cos(angle) * moveSpeed * dt;
            unit.y += Math.sin(angle) * moveSpeed * dt;
          }
        }
        // Siege tank: unsiege when target out of range
        if (unit.type === 'siegetank' && unit.siegeMode) {
          unit.siegeTimer += dt;
          if (unit.siegeTimer > 3) { unit.siegeMode = false; unit.siegeTimer = 0; }
        }
      }
    } else {
      const isPlayer = unit.team === 'player';
      let targetY;
      if (isPlayer) {
        targetY = playerRallyY !== null ? playerRallyY : GAME_H - 250;
      } else {
        targetY = enemyStance === 'defend' ? 250 : GAME_H - 90;
      }
      if (Math.abs(unit.y - targetY) > 5 && effectiveSpeed > 0) {
        // Check force field collision
        let blocked = false;
        if (!unit.isAir) {
          for (const ff of forceFields) {
            if (ff.team === unit.team) continue;
            if (dist(unit, ff) < ff.r + unit.r) { blocked = true; break; }
          }
        }
        if (!blocked) {
          const dir = targetY > unit.y ? 1 : -1;
          unit.y += dir * effectiveSpeed * 50 * dt;
        }
      }
      // Siege tank: unsiege when no target
      if (unit.type === 'siegetank' && unit.siegeMode) {
        unit.siegeTimer += dt;
        if (unit.siegeTimer > 3) { unit.siegeMode = false; unit.siegeTimer = 0; }
      }
    }
  }

  // Projectiles
  for (const p of projectiles) {
    const angle = Math.atan2(p.ty - p.y, p.tx - p.x);
    p.x += Math.cos(angle) * p.speed * dt;
    p.y += Math.sin(angle) * p.speed * dt;
    if (Math.abs(p.x - p.tx) < 10 && Math.abs(p.y - p.ty) < 10) {
      if (p.splash > 0) {
        dealSplash(p.tx, p.ty, p.splash, p.dmg, p.team);
      } else if (p.target) {
        dealDamage(p.target, p.dmg);
      }
      spawnParticle(p.tx, p.ty, p.color, 6);
      p.dead = true;
    }
  }
  projectiles = projectiles.filter(p => !p.dead);

  // Cleanup dead units
  units = units.filter(u => {
    if (u.hp <= 0 && !u.dead) {
      u.dead = true;
      spawnParticle(u.x, u.y, u.color, 10);
      // Subtract supply
      if (u.team === 'player') playerSupply -= (u.supply || 1);
      else enemySupply -= (u.supply || 1);
    }
    return !u.dead;
  });

  // Particles
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    p.alpha = Math.max(0, p.life / p.maxLife);
  }
  particles = particles.filter(p => p.life > 0);

  // Update camera
  if (cameraAutoFollow) {
    // Find frontline player unit (lowest Y = furthest from base)
    let frontlineY = GAME_H - 90;
    for (const u of units) {
      if (u.dead || u.team !== 'player' || u.worker) continue;
      if (u.y < frontlineY) frontlineY = u.y;
    }
    const targetCamY = Math.max(0, Math.min(GAME_H - VIEWPORT_H, (frontlineY + GAME_H - 90) / 2 - VIEWPORT_H / 2));
    cameraY += (targetCamY - cameraY) * 0.03; // smooth lerp
  }
  cameraY = Math.max(0, Math.min(GAME_H - VIEWPORT_H, cameraY));

  // Check win/lose
  if (towers.enemy.base.hp <= 0) { endGame(true); }
  if (towers.player.base.hp <= 0) { endGame(false); }

  // Time limit: 10 minutes
  if (gameTime > 600) {
    const playerTotal = towers.player.left.hp + towers.player.right.hp + towers.player.base.hp;
    const enemyTotal = towers.enemy.left.hp + towers.enemy.right.hp + towers.enemy.base.hp;
    endGame(playerTotal > enemyTotal);
  }
}

function dealDamage(target, dmg) {
  // Ghost cloak: 50% damage reduction
  if (target.type === 'ghost') dmg = Math.floor(dmg * 0.5);
  if (target.shield && target.shield > 0) {
    const absorbed = Math.min(target.shield, dmg);
    target.shield -= absorbed;
    dmg -= absorbed;
  }
  target.hp -= dmg;
  if (target.hp <= 0) {
    target.hp = 0;
    if (target.dead !== undefined) target.dead = true;
  }
}

function dealSplash(x, y, radius, dmg, attackerTeam) {
  for (const u of units) {
    if (u.dead || u.team === attackerTeam) continue;
    if (dist(u, { x, y }) <= radius) {
      dealDamage(u, dmg);
    }
  }
  const enemyTowers = attackerTeam === 'player' ? towers.enemy : towers.player;
  for (const key of ['left', 'right', 'base']) {
    const t = enemyTowers[key];
    if (t.hp <= 0) continue;
    if (dist(t, { x, y }) <= radius + t.r) {
      t.hp -= dmg;
      if (t.hp < 0) t.hp = 0;
    }
  }
  spawnParticle(x, y, '#ffaa33', 15);
}

function spawnParticle(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 20 + Math.random() * 60;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.3 + Math.random() * 0.4,
      maxLife: 0.7,
      color,
      r: 1.5 + Math.random() * 2.5,
      alpha: 1,
    });
  }
}

// ---- Enemy AI ----
let aiTimer = 0;
function updateEnemyAI(dt) {
  aiTimer -= dt;
  if (aiTimer > 0) return;
  aiTimer = 1.0 + Math.random() * 1.5;

  const workerCount = units.filter(u => !u.dead && u.team === 'enemy' && u.worker).length;
  const workerType = WORKER_TYPE[enemyFaction];
  const workerDef = UNIT_DEFS[workerType];
  const baseBuilding = enemyBuildings.find(b => b.type === '_base');

  // Phase 0: Build supply when near cap
  if (enemySupply >= enemySupplyMax - 3) {
    const supplyType = FACTION_SUPPLY[enemyFaction];
    const supplyDef = BUILDING_DEFS[supplyType];
    const hasSupplyBuilding = enemyBuildings.some(b => b.type === supplyType && !b.built);
    if (!hasSupplyBuilding && enemyMinerals >= supplyDef.cost) {
      enemyMinerals -= supplyDef.cost;
      const bx = 50 + enemyBuildings.length * 35;
      enemyBuildings.push({
        type: supplyType, x: bx, y: 140,
        hp: 500, maxHp: 500, built: false, buildProgress: 0, buildTime: supplyDef.buildTime, queue: [],
      });
      return;
    }
  }

  // Phase 0.5: Build gas refinery early
  const gasType = FACTION_GAS[enemyFaction];
  const hasGas = enemyBuildings.some(b => BUILDING_DEFS[b.type] && BUILDING_DEFS[b.type].gasBuilding);
  if (!hasGas && gameTime > 15 && enemyMinerals >= BUILDING_DEFS[gasType].cost) {
    enemyMinerals -= BUILDING_DEFS[gasType].cost;
    enemyBuildings.push({
      type: gasType, x: gasGeysers.enemy.x, y: gasGeysers.enemy.y,
      hp: 500, maxHp: 500, built: false, buildProgress: 0, buildTime: BUILDING_DEFS[gasType].buildTime, queue: [],
    });
    return;
  }

  // Phase 1: Build economy (workers from base)
  if (workerCount < 8 && canAffordUnit(workerType, 'enemy') && baseBuilding && baseBuilding.queue.length < 2) {
    enemyMinerals -= workerDef.cost;
    baseBuilding.queue.push({ type: workerType, timeLeft: workerDef.buildTime, totalTime: workerDef.buildTime });
    return;
  }

  // Phase 2: Build production buildings (skip supply/gas — handled above)
  const availBuildings = getAvailableBuildings('enemy').filter(bt => {
    const bd = BUILDING_DEFS[bt];
    return !bd.supplyCap && !bd.gasBuilding;
  });
  if (availBuildings.length > 0) {
    const btype = availBuildings[0];
    const bdef = BUILDING_DEFS[btype];
    const gasCost = bdef.gasCost || 0;
    if (enemyMinerals >= bdef.cost && enemyGas >= gasCost) {
      enemyMinerals -= bdef.cost;
      enemyGas -= gasCost;
      const bx = 50 + enemyBuildings.length * 35;
      enemyBuildings.push({
        type: btype, x: bx, y: 140,
        hp: 500, maxHp: 500, built: false, buildProgress: 0, buildTime: bdef.buildTime, queue: [],
      });
      return;
    }
  }

  // Phase 3: Build combat units (supply + gas aware)
  const availUnits = getAvailableUnits('enemy');
  const combatUnits = availUnits.filter(u => !UNIT_DEFS[u].worker);
  if (combatUnits.length > 0) {
    const affordable = combatUnits.filter(u => canAffordUnit(u, 'enemy'));
    if (affordable.length > 0) {
      const pick = affordable[Math.floor(Math.random() * affordable.length)];
      const building = getBuildingForUnit(pick, enemyBuildings);
      if (building && building.queue.length < 3) {
        const def = UNIT_DEFS[pick];
        enemyMinerals -= def.cost;
        enemyGas -= (def.gasCost || 0);
        building.queue.push({ type: pick, timeLeft: def.buildTime, totalTime: def.buildTime });
      }
    }
  }

  // Keep building workers up to 12
  if (workerCount < 12 && canAffordUnit(workerType, 'enemy') && baseBuilding && baseBuilding.queue.length < 2) {
    enemyMinerals -= workerDef.cost;
    baseBuilding.queue.push({ type: workerType, timeLeft: workerDef.buildTime, totalTime: workerDef.buildTime });
  }
}

// ---- End Game ----
function endGame(won) {
  gameRunning = false;
  const goText = document.getElementById('goText');
  goText.textContent = won ? 'VICTORY!' : 'DEFEAT!';
  goText.className = 'goText ' + (won ? 'win' : 'lose');
  document.getElementById('gameOverScreen').style.display = 'flex';
}

// ---- Rendering ----
function isVisible(y, margin) {
  return y > cameraY - (margin || 50) && y < cameraY + VIEWPORT_H + (margin || 50);
}

function render() {
  ctx.save();
  ctx.scale(SCALE, SCALE);

  // Background
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, GAME_W, VIEWPORT_H);

  // World-space rendering (offset by camera)
  ctx.save();
  ctx.translate(0, -cameraY);

  // Arena ground (left portion)
  drawArena();

  // River
  drawRiver();

  // Gas geysers
  drawGasGeysers();

  // Mineral patches
  drawMineralPatches();

  // Buildings
  drawBuildings();

  // Towers
  drawTowers();

  // Force fields
  for (const ff of forceFields) {
    const alpha = ff.life / ff.maxLife;
    ctx.fillStyle = `rgba(68, 170, 255, ${alpha * 0.3})`;
    ctx.beginPath(); ctx.arc(ff.x, ff.y, ff.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = `rgba(100, 200, 255, ${alpha * 0.8})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ff.x, ff.y, ff.r, 0, Math.PI * 2); ctx.stroke();
  }

  // Units
  for (const u of units) {
    if (u.dead) continue;
    if (!isVisible(u.y)) continue;
    drawUnit(u);
  }

  // Projectiles
  for (const p of projectiles) {
    if (!isVisible(p.y)) continue;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Particles
  for (const p of particles) {
    if (!isVisible(p.y, 20)) continue;
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Rally point indicator
  if (playerRallyY !== null && isVisible(playerRallyY)) {
    const rpPulse = 0.5 + 0.5 * Math.sin(gameTime * 4);
    ctx.strokeStyle = `rgba(0, 255, 100, ${0.4 + rpPulse * 0.4})`;
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(10, playerRallyY);
    ctx.lineTo(ARENA_W - 10, playerRallyY);
    ctx.stroke();
    ctx.setLineDash([]);
    // Arrow marker
    ctx.fillStyle = `rgba(0, 255, 100, ${0.6 + rpPulse * 0.3})`;
    ctx.beginPath();
    ctx.moveTo(ARENA_W / 2 - 8, playerRallyY - 6);
    ctx.lineTo(ARENA_W / 2 + 8, playerRallyY - 6);
    ctx.lineTo(ARENA_W / 2, playerRallyY + 4);
    ctx.closePath();
    ctx.fill();
    ctx.font = 'bold 7px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('RALLY', ARENA_W / 2, playerRallyY - 10);
  }

  ctx.restore(); // end world-space

  // Screen-space UI
  drawHUD();
  drawProductionPanel();
  drawMinimap();

  ctx.restore();
}

function drawArena() {
  // Ground tiles
  ctx.fillStyle = '#222244';
  ctx.fillRect(20, 20, ARENA_W - 40, GAME_H - 30);

  // Grid lines (only draw visible ones)
  ctx.strokeStyle = '#2a2a4e';
  ctx.lineWidth = 0.5;
  const startY = Math.max(20, Math.floor((cameraY - 10) / 30) * 30);
  const endY = Math.min(GAME_H, cameraY + VIEWPORT_H + 30);
  for (let x = 20; x < ARENA_W - 20; x += 30) {
    ctx.beginPath(); ctx.moveTo(x, startY); ctx.lineTo(x, endY); ctx.stroke();
  }
  for (let y = startY; y < endY; y += 30) {
    ctx.beginPath(); ctx.moveTo(20, y); ctx.lineTo(ARENA_W - 20, y); ctx.stroke();
  }

  // Lane highlights
  ctx.fillStyle = 'rgba(255,255,255,0.02)';
  ctx.fillRect(LANE_X[0] - 50, 20, 100, GAME_H - 30);
  ctx.fillRect(LANE_X[1] - 50, 20, 100, GAME_H - 30);

  // Side walls
  ctx.fillStyle = '#333366';
  ctx.fillRect(0, 0, 20, GAME_H);
}

function drawRiver() {
  // Water
  const shimmer = Math.sin(gameTime * 2) * 0.1 + 0.4;
  ctx.fillStyle = `rgba(0, 100, 200, ${shimmer})`;
  ctx.fillRect(20, RIVER_Y, ARENA_W - 40, RIVER_H);

  // Bridges
  ctx.fillStyle = '#444466';
  for (const lx of LANE_X) {
    ctx.fillRect(lx - BRIDGE_W / 2, RIVER_Y - 2, BRIDGE_W, RIVER_H + 4);
    ctx.strokeStyle = '#555588';
    ctx.lineWidth = 1;
    ctx.strokeRect(lx - BRIDGE_W / 2, RIVER_Y - 2, BRIDGE_W, RIVER_H + 4);
  }
}

function drawTower(t, teamColor, isBase) {
  if (t.hp <= 0) {
    // Destroyed
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r * 0.7, 0, Math.PI * 2);
    ctx.fill();
    return;
  }

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(t.x + 2, t.y + 3, t.r + 2, t.r * 0.6 + 2, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body
  const grad = ctx.createRadialGradient(t.x - 3, t.y - 3, 2, t.x, t.y, t.r);
  grad.addColorStop(0, isBase ? '#667788' : '#556677');
  grad.addColorStop(1, '#223344');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
  ctx.fill();

  // Team color ring
  ctx.strokeStyle = teamColor;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
  ctx.stroke();

  // HP bar
  const barW = t.r * 2.2;
  const hpFrac = t.hp / t.maxHp;
  ctx.fillStyle = '#111';
  ctx.fillRect(t.x - barW / 2, t.y - t.r - 10, barW, 5);
  ctx.fillStyle = hpFrac > 0.5 ? '#44dd44' : hpFrac > 0.25 ? '#ddaa00' : '#dd3333';
  ctx.fillRect(t.x - barW / 2, t.y - t.r - 10, barW * hpFrac, 5);

  // Icon
  ctx.fillStyle = teamColor;
  ctx.font = `bold ${isBase ? 14 : 11}px monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(isBase ? 'HQ' : 'T', t.x, t.y);
}

function drawTowers() {
  const pc = FACTION_COLORS[playerFaction].primary;
  const ec = FACTION_COLORS[enemyFaction].primary;

  drawTower(towers.player.left, pc, false);
  drawTower(towers.player.right, pc, false);
  drawTower(towers.player.base, pc, true);
  drawTower(towers.enemy.left, ec, false);
  drawTower(towers.enemy.right, ec, false);
  drawTower(towers.enemy.base, ec, true);
}

function drawUnit(u) {
  const bob = Math.sin(u.animFrame) * (u.isAir ? 3 : 1.5);
  const airOffset = u.isAir ? -8 : 0;
  const cx = u.x;
  const cy = u.y + bob + airOffset;
  const r = u.r;
  const dir = u.team === 'player' ? -1 : 1;

  // Shadow (further away for air units)
  const shadowOffset = u.isAir ? 12 : 2;
  ctx.fillStyle = u.isAir ? 'rgba(0,0,0,0.2)' : 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(u.x + 1, u.y + r * 0.6 + shadowOffset, r * (u.isAir ? 1.2 : 1.0), r * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Siege mode indicator
  if (u.siegeMode) {
    ctx.strokeStyle = 'rgba(255,100,0,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, r + 5, 0, Math.PI * 2); ctx.stroke();
  }

  // Draw SC2-accurate unit
  ctx.save();
  drawSC2Unit(u.type, cx, cy, r, dir, u.color, u.team, u.animFrame);
  ctx.restore();

  // Shield indicator (protoss)
  if (u.maxShield > 0 && u.shield > 0) {
    ctx.strokeStyle = 'rgba(100, 200, 255, 0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, r + 3, -Math.PI/2, -Math.PI/2 + Math.PI * 2 * (u.shield / u.maxShield));
    ctx.stroke();
  }

  // HP bar
  if (u.hp < u.maxHp) {
    const barW = r * 2.4;
    const hpFrac = u.hp / u.maxHp;
    ctx.fillStyle = '#000';
    ctx.fillRect(cx - barW / 2, cy - r - 8, barW, 3);
    ctx.fillStyle = hpFrac > 0.5 ? '#44dd44' : hpFrac > 0.25 ? '#ddaa00' : '#dd3333';
    ctx.fillRect(cx - barW / 2, cy - r - 8, barW * hpFrac, 3);
  }
}

// ---- SC2 Unit Drawing System ----
function drawSC2Unit(type, cx, cy, r, dir, color, team, anim) {
  switch(type) {
    case 'marine': drawMarine(cx, cy, r, dir, color, anim); break;
    case 'marauder': drawMarauder(cx, cy, r, dir, color, anim); break;
    case 'medic': drawMedicUnit(cx, cy, r, dir, color, anim); break;
    case 'siegetank': drawSiegeTank(cx, cy, r, dir, color, anim); break;
    case 'ghost': drawGhost(cx, cy, r, dir, color, anim); break;
    case 'scv': drawSCV(cx, cy, r, dir, color, anim); break;
    case 'zealot': drawZealot(cx, cy, r, dir, color, anim); break;
    case 'stalker': drawStalker(cx, cy, r, dir, color, anim); break;
    case 'sentry': drawSentryUnit(cx, cy, r, dir, color, anim); break;
    case 'hightemplar': drawHighTemplar(cx, cy, r, dir, color, anim); break;
    case 'immortal': drawImmortal(cx, cy, r, dir, color, anim); break;
    case 'probe': drawProbeUnit(cx, cy, r, dir, color, anim); break;
    case 'zergling': drawZergling(cx, cy, r, dir, color, anim); break;
    case 'roach': drawRoach(cx, cy, r, dir, color, anim); break;
    case 'hydralisk': drawHydralisk(cx, cy, r, dir, color, anim); break;
    case 'baneling': drawBaneling(cx, cy, r, dir, color, anim); break;
    case 'ultralisk': drawUltralisk(cx, cy, r, dir, color, anim); break;
    case 'drone': drawDroneUnit(cx, cy, r, dir, color, anim); break;
    // Air units
    case 'viking': drawVikingUnit(cx, cy, r, dir, color, anim); break;
    case 'medivac': drawMedivacUnit(cx, cy, r, dir, color, anim); break;
    case 'battlecruiser': drawBattlecruiserUnit(cx, cy, r, dir, color, anim); break;
    case 'phoenix': drawPhoenixUnit(cx, cy, r, dir, color, anim); break;
    case 'voidray': drawVoidRayUnit(cx, cy, r, dir, color, anim); break;
    case 'carrier': drawCarrierUnit(cx, cy, r, dir, color, anim); break;
    case 'mutalisk': drawMutaliskUnit(cx, cy, r, dir, color, anim); break;
    case 'corruptor': drawCorruptorUnit(cx, cy, r, dir, color, anim); break;
    case 'broodlord': drawBroodLordUnit(cx, cy, r, dir, color, anim); break;
    default:
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  }
}

// Helper: darken/lighten color
function shadeColor(col, amt) {
  let c = col.replace('#','');
  if (c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  let r = Math.min(255, Math.max(0, parseInt(c.substring(0,2),16) + amt));
  let g = Math.min(255, Math.max(0, parseInt(c.substring(2,4),16) + amt));
  let b = Math.min(255, Math.max(0, parseInt(c.substring(4,6),16) + amt));
  return '#' + (r<16?'0':'') + r.toString(16) + (g<16?'0':'') + g.toString(16) + (b<16?'0':'') + b.toString(16);
}

// ========== TERRAN UNITS ==========

function drawMarine(cx, cy, r, dir, color, anim) {
  const s = r / 8; // scale factor (default r=8)
  // Legs
  ctx.fillStyle = shadeColor(color, -60);
  ctx.fillRect(cx - s*3, cy + s*4*dir, s*2, s*5*dir);
  ctx.fillRect(cx + s*1, cy + s*4*dir, s*2, s*5*dir);
  // Torso - power armor (rounded rect body)
  ctx.fillStyle = shadeColor(color, -30);
  roundRect(ctx, cx - s*5, cy - s*5, s*10, s*10, s*2, true, false);
  // Armor plating highlight
  ctx.fillStyle = color;
  roundRect(ctx, cx - s*4, cy - s*4, s*8, s*7, s*2, true, false);
  // Shoulder pads
  ctx.fillStyle = shadeColor(color, 20);
  ctx.beginPath(); ctx.arc(cx - s*5, cy - s*1, s*3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*5, cy - s*1, s*3, 0, Math.PI*2); ctx.fill();
  // Visor
  ctx.fillStyle = '#00ccff';
  ctx.fillRect(cx - s*3, cy - s*3 + s*dir, s*6, s*2);
  ctx.fillStyle = 'rgba(0,220,255,0.4)';
  ctx.fillRect(cx - s*3, cy - s*3 + s*dir, s*6, s*2);
  // Rifle barrel (extending forward)
  ctx.fillStyle = '#445566';
  ctx.fillRect(cx + s*3, cy - s*1, s*2, -s*8*dir);
  // Rifle muzzle
  ctx.fillStyle = '#667788';
  ctx.fillRect(cx + s*2.5, cy - s*1 - s*8*dir, s*3, s*2);
  // Outline
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 0.5;
  roundRect(ctx, cx - s*5, cy - s*5, s*10, s*10, s*2, false, true);
}

function drawMarauder(cx, cy, r, dir, color, anim) {
  const s = r / 10;
  // Legs (thick)
  ctx.fillStyle = shadeColor(color, -70);
  ctx.fillRect(cx - s*4, cy + s*4*dir, s*3, s*6*dir);
  ctx.fillRect(cx + s*1, cy + s*4*dir, s*3, s*6*dir);
  // Heavy torso
  ctx.fillStyle = shadeColor(color, -40);
  roundRect(ctx, cx - s*7, cy - s*6, s*14, s*12, s*3, true, false);
  // Armor plates
  ctx.fillStyle = color;
  roundRect(ctx, cx - s*6, cy - s*5, s*12, s*9, s*2, true, false);
  // Center armor line
  ctx.strokeStyle = shadeColor(color, -50);
  ctx.lineWidth = s*1;
  ctx.beginPath(); ctx.moveTo(cx, cy - s*5); ctx.lineTo(cx, cy + s*4); ctx.stroke();
  // Heavy shoulder armor
  ctx.fillStyle = shadeColor(color, 15);
  roundRect(ctx, cx - s*9, cy - s*4, s*5, s*6, s*2, true, false);
  roundRect(ctx, cx + s*4, cy - s*4, s*5, s*6, s*2, true, false);
  // Grenade launchers (two barrels per side)
  ctx.fillStyle = '#556677';
  ctx.fillRect(cx - s*8, cy - s*2, s*2, -s*7*dir);
  ctx.fillRect(cx + s*6, cy - s*2, s*2, -s*7*dir);
  // Launcher tips
  ctx.fillStyle = '#778899';
  ctx.beginPath(); ctx.arc(cx - s*7, cy - s*2 - s*7*dir, s*1.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*7, cy - s*2 - s*7*dir, s*1.5, 0, Math.PI*2); ctx.fill();
  // Visor (red)
  ctx.fillStyle = '#ff3300';
  ctx.fillRect(cx - s*4, cy - s*3, s*8, s*2);
}

function drawMedicUnit(cx, cy, r, dir, color, anim) {
  const s = r / 8;
  // Legs
  ctx.fillStyle = '#334455';
  ctx.fillRect(cx - s*2.5, cy + s*3*dir, s*2, s*5*dir);
  ctx.fillRect(cx + s*0.5, cy + s*3*dir, s*2, s*5*dir);
  // Body (slimmer than marine)
  ctx.fillStyle = '#ccddee';
  roundRect(ctx, cx - s*4, cy - s*4, s*8, s*8, s*2, true, false);
  // White armor with team accent
  ctx.fillStyle = '#eef4ff';
  roundRect(ctx, cx - s*3, cy - s*3, s*6, s*6, s*1.5, true, false);
  // Red cross
  ctx.fillStyle = '#ff2222';
  ctx.fillRect(cx - s*0.7, cy - s*2.5, s*1.4, s*5);
  ctx.fillRect(cx - s*2.5, cy - s*0.7, s*5, s*1.4);
  // Medical backpack
  ctx.fillStyle = '#99aabb';
  roundRect(ctx, cx - s*2, cy + s*2*dir, s*4, s*3*dir, s*1, true, false);
  // Healing device arm
  ctx.strokeStyle = '#66ffaa';
  ctx.lineWidth = s*1;
  ctx.beginPath();
  ctx.moveTo(cx + s*4, cy);
  ctx.lineTo(cx + s*7, cy - s*4*dir);
  ctx.stroke();
  // Healing tip glow
  const glowR = s*2 + Math.sin(anim*3)*s*0.5;
  ctx.fillStyle = 'rgba(100,255,150,0.5)';
  ctx.beginPath(); ctx.arc(cx + s*7, cy - s*4*dir, glowR, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#66ff99';
  ctx.beginPath(); ctx.arc(cx + s*7, cy - s*4*dir, s*1, 0, Math.PI*2); ctx.fill();
}

function drawSiegeTank(cx, cy, r, dir, color, anim) {
  const s = r / 14;
  // Track left
  ctx.fillStyle = '#333344';
  roundRect(ctx, cx - s*13, cy - s*8, s*4, s*16, s*2, true, false);
  // Track right
  roundRect(ctx, cx + s*9, cy - s*8, s*4, s*16, s*2, true, false);
  // Track detail lines
  ctx.strokeStyle = '#444455';
  ctx.lineWidth = s*0.8;
  for (let i = -6; i <= 6; i += 3) {
    ctx.beginPath(); ctx.moveTo(cx - s*13, cy + s*i); ctx.lineTo(cx - s*9, cy + s*i); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + s*9, cy + s*i); ctx.lineTo(cx + s*13, cy + s*i); ctx.stroke();
  }
  // Hull (main body)
  ctx.fillStyle = shadeColor(color, -30);
  roundRect(ctx, cx - s*9, cy - s*7, s*18, s*14, s*2, true, false);
  // Upper hull detail
  ctx.fillStyle = color;
  roundRect(ctx, cx - s*7, cy - s*5, s*14, s*10, s*2, true, false);
  // Armor lines
  ctx.strokeStyle = shadeColor(color, -50);
  ctx.lineWidth = s*0.6;
  ctx.beginPath(); ctx.moveTo(cx - s*7, cy); ctx.lineTo(cx + s*7, cy); ctx.stroke();
  // Turret base (circle)
  ctx.fillStyle = shadeColor(color, 10);
  ctx.beginPath(); ctx.arc(cx, cy - s*1, s*5, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = shadeColor(color, -20);
  ctx.lineWidth = s*0.8;
  ctx.beginPath(); ctx.arc(cx, cy - s*1, s*5, 0, Math.PI*2); ctx.stroke();
  // Main cannon barrel
  ctx.fillStyle = '#556677';
  ctx.save();
  ctx.translate(cx, cy - s*1);
  ctx.fillRect(-s*1.5, 0, s*3, -s*14*dir);
  // Cannon muzzle brake
  ctx.fillStyle = '#667788';
  ctx.fillRect(-s*2.5, -s*14*dir, s*5, -s*2*dir);
  ctx.restore();
  // Turret top detail
  ctx.fillStyle = shadeColor(color, 30);
  ctx.beginPath(); ctx.arc(cx, cy - s*1, s*2.5, 0, Math.PI*2); ctx.fill();
}

function drawGhost(cx, cy, r, dir, color, anim) {
  const s = r / 9;
  const shimmer = Math.sin(anim * 4) * 0.15 + 0.65;
  ctx.globalAlpha = shimmer;
  // Legs
  ctx.fillStyle = shadeColor(color, -40);
  ctx.fillRect(cx - s*2, cy + s*3*dir, s*1.5, s*5*dir);
  ctx.fillRect(cx + s*0.5, cy + s*3*dir, s*1.5, s*5*dir);
  // Slim body
  ctx.fillStyle = shadeColor(color, -20);
  ctx.beginPath();
  ctx.moveTo(cx - s*3, cy + s*4);
  ctx.lineTo(cx - s*4, cy - s*2);
  ctx.lineTo(cx - s*2, cy - s*5);
  ctx.lineTo(cx + s*2, cy - s*5);
  ctx.lineTo(cx + s*4, cy - s*2);
  ctx.lineTo(cx + s*3, cy + s*4);
  ctx.closePath();
  ctx.fill();
  // Suit detail
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx - s*2, cy + s*3);
  ctx.lineTo(cx - s*3, cy - s*1);
  ctx.lineTo(cx - s*1.5, cy - s*4);
  ctx.lineTo(cx + s*1.5, cy - s*4);
  ctx.lineTo(cx + s*3, cy - s*1);
  ctx.lineTo(cx + s*2, cy + s*3);
  ctx.closePath();
  ctx.fill();
  // Sniper rifle (long barrel)
  ctx.fillStyle = '#445566';
  ctx.fillRect(cx + s*2, cy + s*1, s*1.5, -s*12*dir);
  // Scope
  ctx.fillStyle = '#ff0000';
  ctx.beginPath(); ctx.arc(cx + s*2.75, cy + s*1 - s*10*dir, s*1, 0, Math.PI*2); ctx.fill();
  // Visor (red glow)
  ctx.fillStyle = '#ff0044';
  ctx.beginPath(); ctx.arc(cx - s*1, cy - s*3, s*1.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*1, cy - s*3, s*1.2, 0, Math.PI*2); ctx.fill();
  // Cloak shimmer outline
  ctx.strokeStyle = 'rgba(150,200,255,0.4)';
  ctx.lineWidth = s*0.5;
  ctx.setLineDash([s*2, s*2]);
  ctx.beginPath(); ctx.arc(cx, cy, r + s*2, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
}

function drawSCV(cx, cy, r, dir, color, anim) {
  const s = r / 8;
  // Mechanical legs (inverted V)
  ctx.strokeStyle = '#556666';
  ctx.lineWidth = s*2;
  ctx.beginPath();
  ctx.moveTo(cx - s*4, cy + s*7*dir);
  ctx.lineTo(cx - s*2, cy + s*2*dir);
  ctx.lineTo(cx, cy + s*4*dir);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + s*4, cy + s*7*dir);
  ctx.lineTo(cx + s*2, cy + s*2*dir);
  ctx.lineTo(cx, cy + s*4*dir);
  ctx.stroke();
  // Joint circles
  ctx.fillStyle = '#667777';
  ctx.beginPath(); ctx.arc(cx - s*2, cy + s*2*dir, s*1, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*2, cy + s*2*dir, s*1, 0, Math.PI*2); ctx.fill();
  // Boxy body
  ctx.fillStyle = shadeColor(color, -20);
  roundRect(ctx, cx - s*5, cy - s*5, s*10, s*8, s*2, true, false);
  // Cockpit window
  ctx.fillStyle = '#88ddff';
  ctx.beginPath();
  ctx.arc(cx, cy - s*3, s*2.5, Math.PI, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = 'rgba(150,230,255,0.5)';
  ctx.beginPath();
  ctx.arc(cx, cy - s*3, s*2, Math.PI*1.1, Math.PI*1.9);
  ctx.fill();
  // Body panel
  ctx.fillStyle = color;
  roundRect(ctx, cx - s*4, cy - s*1, s*8, s*4, s*1, true, false);
  // Drill arm
  ctx.fillStyle = '#778888';
  ctx.save();
  ctx.translate(cx - s*5, cy);
  const drillAngle = Math.sin(anim * 5) * 0.2;
  ctx.rotate(drillAngle);
  ctx.fillRect(-s*6, -s*1, s*6, s*2);
  // Drill tip (cone)
  ctx.fillStyle = '#aabbbb';
  ctx.beginPath();
  ctx.moveTo(-s*6, -s*2);
  ctx.lineTo(-s*9, 0);
  ctx.lineTo(-s*6, s*2);
  ctx.closePath();
  ctx.fill();
  // Drill lines
  ctx.strokeStyle = '#889999';
  ctx.lineWidth = s*0.5;
  ctx.beginPath();
  ctx.moveTo(-s*7, -s*1.2); ctx.lineTo(-s*8.5, 0);
  ctx.moveTo(-s*7, s*1.2); ctx.lineTo(-s*8.5, 0);
  ctx.stroke();
  ctx.restore();
}

// ========== PROTOSS UNITS ==========

function drawZealot(cx, cy, r, dir, color, anim) {
  const s = r / 10;
  // Legs with armor plates
  ctx.fillStyle = shadeColor(color, -50);
  // Left leg
  ctx.beginPath();
  ctx.moveTo(cx - s*3, cy + s*3*dir);
  ctx.lineTo(cx - s*5, cy + s*8*dir);
  ctx.lineTo(cx - s*2, cy + s*8*dir);
  ctx.lineTo(cx - s*1, cy + s*3*dir);
  ctx.closePath();
  ctx.fill();
  // Right leg
  ctx.beginPath();
  ctx.moveTo(cx + s*1, cy + s*3*dir);
  ctx.lineTo(cx + s*2, cy + s*8*dir);
  ctx.lineTo(cx + s*5, cy + s*8*dir);
  ctx.lineTo(cx + s*3, cy + s*3*dir);
  ctx.closePath();
  ctx.fill();
  // Angular torso (triangular chest plate)
  ctx.fillStyle = shadeColor(color, -20);
  ctx.beginPath();
  ctx.moveTo(cx, cy - s*6);
  ctx.lineTo(cx + s*6, cy + s*1);
  ctx.lineTo(cx + s*4, cy + s*4);
  ctx.lineTo(cx - s*4, cy + s*4);
  ctx.lineTo(cx - s*6, cy + s*1);
  ctx.closePath();
  ctx.fill();
  // Chest armor detail
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx, cy - s*4);
  ctx.lineTo(cx + s*4, cy + s*1);
  ctx.lineTo(cx + s*3, cy + s*3);
  ctx.lineTo(cx - s*3, cy + s*3);
  ctx.lineTo(cx - s*4, cy + s*1);
  ctx.closePath();
  ctx.fill();
  // Eyes (two glowing dots)
  ctx.fillStyle = '#00ccff';
  ctx.beginPath(); ctx.arc(cx - s*1.5, cy - s*3, s*0.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*1.5, cy - s*3, s*0.8, 0, Math.PI*2); ctx.fill();
  // Psi blades (glowing, animated)
  const bladeFlicker = Math.sin(anim * 8) * s*0.5;
  const bladeLen = s*10 + bladeFlicker;
  // Left blade
  ctx.strokeStyle = '#00eeff';
  ctx.lineWidth = s*1.5;
  ctx.shadowColor = '#00eeff';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.moveTo(cx - s*6, cy + s*1);
  ctx.lineTo(cx - s*6 - s*2, cy + s*1 - bladeLen*dir);
  ctx.stroke();
  // Right blade
  ctx.beginPath();
  ctx.moveTo(cx + s*6, cy + s*1);
  ctx.lineTo(cx + s*6 + s*2, cy + s*1 - bladeLen*dir);
  ctx.stroke();
  // Blade glow
  ctx.fillStyle = 'rgba(0,238,255,0.3)';
  ctx.beginPath(); ctx.arc(cx - s*7, cy + s*1 - bladeLen*dir*0.5, s*2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*7, cy + s*1 - bladeLen*dir*0.5, s*2, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
}

function drawStalker(cx, cy, r, dir, color, anim) {
  const s = r / 9;
  // Four legs (X pattern)
  ctx.strokeStyle = shadeColor(color, -40);
  ctx.lineWidth = s*1.5;
  // Front-left
  ctx.beginPath(); ctx.moveTo(cx - s*3, cy - s*2); ctx.lineTo(cx - s*7, cy - s*7*dir); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - s*7, cy - s*7*dir); ctx.lineTo(cx - s*9, cy - s*5*dir); ctx.stroke();
  // Front-right
  ctx.beginPath(); ctx.moveTo(cx + s*3, cy - s*2); ctx.lineTo(cx + s*7, cy - s*7*dir); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + s*7, cy - s*7*dir); ctx.lineTo(cx + s*9, cy - s*5*dir); ctx.stroke();
  // Back-left
  ctx.beginPath(); ctx.moveTo(cx - s*3, cy + s*2); ctx.lineTo(cx - s*7, cy + s*6*dir); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - s*7, cy + s*6*dir); ctx.lineTo(cx - s*8, cy + s*8*dir); ctx.stroke();
  // Back-right
  ctx.beginPath(); ctx.moveTo(cx + s*3, cy + s*2); ctx.lineTo(cx + s*7, cy + s*6*dir); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + s*7, cy + s*6*dir); ctx.lineTo(cx + s*8, cy + s*8*dir); ctx.stroke();
  // Leg joint circles
  ctx.fillStyle = shadeColor(color, -20);
  ctx.beginPath(); ctx.arc(cx - s*7, cy - s*7*dir, s*1, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*7, cy - s*7*dir, s*1, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx - s*7, cy + s*6*dir, s*1, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*7, cy + s*6*dir, s*1, 0, Math.PI*2); ctx.fill();
  // Central body (diamond/oval)
  ctx.fillStyle = shadeColor(color, -15);
  ctx.beginPath();
  ctx.moveTo(cx, cy - s*5);
  ctx.quadraticCurveTo(cx + s*5, cy, cx, cy + s*5);
  ctx.quadraticCurveTo(cx - s*5, cy, cx, cy - s*5);
  ctx.fill();
  // Body core
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx, cy - s*3);
  ctx.quadraticCurveTo(cx + s*3, cy, cx, cy + s*3);
  ctx.quadraticCurveTo(cx - s*3, cy, cx, cy - s*3);
  ctx.fill();
  // Blue energy core
  ctx.fillStyle = '#0088ff';
  ctx.beginPath(); ctx.arc(cx, cy, s*1.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(0,150,255,0.3)';
  ctx.beginPath(); ctx.arc(cx, cy, s*3, 0, Math.PI*2); ctx.fill();
  // Particle disruptor barrel (forward)
  ctx.fillStyle = '#556677';
  ctx.fillRect(cx - s*1, cy - s*2, s*2, -s*6*dir);
  ctx.fillStyle = '#0088ff';
  ctx.beginPath(); ctx.arc(cx, cy - s*2 - s*6*dir, s*1.2, 0, Math.PI*2); ctx.fill();
}

function drawSentryUnit(cx, cy, r, dir, color, anim) {
  const s = r / 8;
  // Hover glow
  ctx.fillStyle = 'rgba(255,230,100,0.15)';
  ctx.beginPath(); ctx.ellipse(cx, cy + s*5, s*6, s*2, 0, 0, Math.PI*2); ctx.fill();
  // Side fins
  ctx.fillStyle = shadeColor(color, -30);
  // Left fin
  ctx.beginPath();
  ctx.moveTo(cx - s*4, cy - s*2);
  ctx.lineTo(cx - s*7, cy);
  ctx.lineTo(cx - s*7, cy + s*3);
  ctx.lineTo(cx - s*4, cy + s*2);
  ctx.closePath();
  ctx.fill();
  // Right fin
  ctx.beginPath();
  ctx.moveTo(cx + s*4, cy - s*2);
  ctx.lineTo(cx + s*7, cy);
  ctx.lineTo(cx + s*7, cy + s*3);
  ctx.lineTo(cx + s*4, cy + s*2);
  ctx.closePath();
  ctx.fill();
  // Main body (oval)
  ctx.fillStyle = shadeColor(color, -10);
  ctx.beginPath();
  ctx.ellipse(cx, cy, s*5, s*4, 0, 0, Math.PI*2);
  ctx.fill();
  // Body accent
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(cx, cy, s*3.5, s*3, 0, 0, Math.PI*2);
  ctx.fill();
  // Central eye
  ctx.fillStyle = '#00ddff';
  ctx.beginPath(); ctx.arc(cx, cy - s*1, s*1.5, 0, Math.PI*2); ctx.fill();
  ctx.shadowColor = '#00ddff';
  ctx.shadowBlur = 4;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(cx, cy - s*1, s*0.7, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  // Shield projector arc (below)
  ctx.strokeStyle = 'rgba(100,200,255,0.5)';
  ctx.lineWidth = s*1;
  const shieldPulse = Math.sin(anim * 3) * 0.3 + 0.7;
  ctx.globalAlpha = shieldPulse;
  ctx.beginPath();
  ctx.arc(cx, cy + s*2, s*4, 0, Math.PI);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawHighTemplar(cx, cy, r, dir, color, anim) {
  const s = r / 9;
  // Energy aura
  const auraSize = s*8 + Math.sin(anim*3)*s*1;
  ctx.fillStyle = 'rgba(100,100,255,0.12)';
  ctx.beginPath(); ctx.arc(cx, cy, auraSize, 0, Math.PI*2); ctx.fill();
  // Robe (wide at bottom, narrow at top)
  ctx.fillStyle = shadeColor(color, -40);
  ctx.beginPath();
  ctx.moveTo(cx - s*2, cy - s*6);
  ctx.lineTo(cx + s*2, cy - s*6);
  ctx.lineTo(cx + s*5, cy + s*5);
  ctx.lineTo(cx - s*5, cy + s*5);
  ctx.closePath();
  ctx.fill();
  // Robe inner
  ctx.fillStyle = shadeColor(color, -15);
  ctx.beginPath();
  ctx.moveTo(cx - s*1.5, cy - s*5);
  ctx.lineTo(cx + s*1.5, cy - s*5);
  ctx.lineTo(cx + s*4, cy + s*4);
  ctx.lineTo(cx - s*4, cy + s*4);
  ctx.closePath();
  ctx.fill();
  // Hood
  ctx.fillStyle = shadeColor(color, -30);
  ctx.beginPath();
  ctx.arc(cx, cy - s*5, s*3, Math.PI, Math.PI*2);
  ctx.fill();
  // Glowing eyes under hood
  ctx.fillStyle = '#88aaff';
  ctx.beginPath(); ctx.arc(cx - s*1, cy - s*5, s*0.7, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*1, cy - s*5, s*0.7, 0, Math.PI*2); ctx.fill();
  // Psionic energy hands
  ctx.shadowColor = '#8888ff';
  ctx.shadowBlur = 5;
  const handGlow = Math.sin(anim*5)*s*0.8;
  // Left hand energy
  ctx.fillStyle = 'rgba(130,130,255,0.7)';
  ctx.beginPath(); ctx.arc(cx - s*4, cy - s*1, s*2 + handGlow, 0, Math.PI*2); ctx.fill();
  // Right hand energy
  ctx.beginPath(); ctx.arc(cx + s*4, cy - s*1, s*2 - handGlow, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  // Lightning crackling between hands
  ctx.strokeStyle = 'rgba(150,150,255,0.6)';
  ctx.lineWidth = s*0.5;
  ctx.beginPath();
  ctx.moveTo(cx - s*4, cy - s*1);
  const midX = cx + Math.sin(anim*7)*s*2;
  ctx.lineTo(midX, cy - s*3);
  ctx.lineTo(cx + s*4, cy - s*1);
  ctx.stroke();
}

function drawImmortal(cx, cy, r, dir, color, anim) {
  const s = r / 13;
  // Four stubby legs
  ctx.fillStyle = shadeColor(color, -50);
  ctx.fillRect(cx - s*10, cy + s*4*dir, s*3, s*5*dir);
  ctx.fillRect(cx + s*7, cy + s*4*dir, s*3, s*5*dir);
  ctx.fillRect(cx - s*7, cy + s*6*dir, s*3, s*4*dir);
  ctx.fillRect(cx + s*4, cy + s*6*dir, s*3, s*4*dir);
  // Large armored body
  ctx.fillStyle = shadeColor(color, -25);
  roundRect(ctx, cx - s*8, cy - s*6, s*16, s*12, s*3, true, false);
  // Body core
  ctx.fillStyle = color;
  roundRect(ctx, cx - s*6, cy - s*4, s*12, s*8, s*2, true, false);
  // Armor plating lines
  ctx.strokeStyle = shadeColor(color, -45);
  ctx.lineWidth = s*0.7;
  ctx.beginPath();
  ctx.moveTo(cx - s*6, cy - s*1); ctx.lineTo(cx + s*6, cy - s*1);
  ctx.moveTo(cx, cy - s*4); ctx.lineTo(cx, cy + s*4);
  ctx.stroke();
  // Two massive cannon arms
  ctx.fillStyle = '#667788';
  // Left cannon
  roundRect(ctx, cx - s*13, cy - s*4, s*6, s*5, s*1, true, false);
  ctx.fillRect(cx - s*12, cy - s*3, s*2, -s*8*dir);
  ctx.fillStyle = '#7799aa';
  ctx.beginPath(); ctx.arc(cx - s*11, cy - s*3 - s*8*dir, s*1.5, 0, Math.PI*2); ctx.fill();
  // Right cannon
  ctx.fillStyle = '#667788';
  roundRect(ctx, cx + s*7, cy - s*4, s*6, s*5, s*1, true, false);
  ctx.fillRect(cx + s*10, cy - s*3, s*2, -s*8*dir);
  ctx.fillStyle = '#7799aa';
  ctx.beginPath(); ctx.arc(cx + s*11, cy - s*3 - s*8*dir, s*1.5, 0, Math.PI*2); ctx.fill();
  // Shield generator glow
  ctx.fillStyle = 'rgba(0,150,255,0.25)';
  ctx.beginPath(); ctx.arc(cx, cy, s*5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#3399ff';
  ctx.beginPath(); ctx.arc(cx, cy, s*2, 0, Math.PI*2); ctx.fill();
}

function drawProbeUnit(cx, cy, r, dir, color, anim) {
  const s = r / 8;
  // Hover glow/shadow
  ctx.fillStyle = 'rgba(255,220,50,0.15)';
  ctx.beginPath(); ctx.ellipse(cx, cy + s*5, s*4, s*1.5, 0, 0, Math.PI*2); ctx.fill();
  // Energy trail beneath
  const trail = Math.sin(anim*4)*s*0.5;
  ctx.fillStyle = 'rgba(255,230,100,0.3)';
  ctx.beginPath();
  ctx.moveTo(cx - s*1, cy + s*3);
  ctx.lineTo(cx, cy + s*6 + trail);
  ctx.lineTo(cx + s*1, cy + s*3);
  ctx.closePath();
  ctx.fill();
  // Diamond/pyramid body (rotated square)
  ctx.fillStyle = shadeColor(color, -15);
  ctx.beginPath();
  ctx.moveTo(cx, cy - s*5);
  ctx.lineTo(cx + s*5, cy);
  ctx.lineTo(cx, cy + s*4);
  ctx.lineTo(cx - s*5, cy);
  ctx.closePath();
  ctx.fill();
  // Inner diamond
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx, cy - s*3.5);
  ctx.lineTo(cx + s*3.5, cy);
  ctx.lineTo(cx, cy + s*2.5);
  ctx.lineTo(cx - s*3.5, cy);
  ctx.closePath();
  ctx.fill();
  // Small antenna on top
  ctx.strokeStyle = shadeColor(color, 30);
  ctx.lineWidth = s*0.6;
  ctx.beginPath();
  ctx.moveTo(cx, cy - s*5);
  ctx.lineTo(cx, cy - s*7);
  ctx.stroke();
  ctx.fillStyle = '#88ddff';
  ctx.beginPath(); ctx.arc(cx, cy - s*7, s*0.8, 0, Math.PI*2); ctx.fill();
  // Pulsing energy core
  const pulse = Math.sin(anim*5)*s*0.5 + s*1.5;
  ctx.fillStyle = 'rgba(0,200,255,0.5)';
  ctx.beginPath(); ctx.arc(cx, cy - s*0.5, pulse, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#44ddff';
  ctx.beginPath(); ctx.arc(cx, cy - s*0.5, s*0.8, 0, Math.PI*2); ctx.fill();
}

// ========== ZERG UNITS ==========

function drawZergling(cx, cy, r, dir, color, anim) {
  const s = r / 6;
  // Four legs (angled out, animated)
  ctx.strokeStyle = shadeColor(color, -40);
  ctx.lineWidth = s*1;
  const legAnim = Math.sin(anim*8)*s*1;
  // Front-left
  ctx.beginPath(); ctx.moveTo(cx - s*2, cy - s*1*dir); ctx.lineTo(cx - s*5 - legAnim, cy - s*4*dir); ctx.stroke();
  // Front-right
  ctx.beginPath(); ctx.moveTo(cx + s*2, cy - s*1*dir); ctx.lineTo(cx + s*5 + legAnim, cy - s*4*dir); ctx.stroke();
  // Back-left
  ctx.beginPath(); ctx.moveTo(cx - s*2, cy + s*1*dir); ctx.lineTo(cx - s*4 + legAnim, cy + s*4*dir); ctx.stroke();
  // Back-right
  ctx.beginPath(); ctx.moveTo(cx + s*2, cy + s*1*dir); ctx.lineTo(cx + s*4 - legAnim, cy + s*4*dir); ctx.stroke();
  // Elongated body (teardrop)
  ctx.fillStyle = shadeColor(color, -20);
  ctx.beginPath();
  ctx.ellipse(cx, cy, s*3, s*4, 0, 0, Math.PI*2);
  ctx.fill();
  // Carapace ridge line
  ctx.strokeStyle = shadeColor(color, 20);
  ctx.lineWidth = s*0.8;
  ctx.beginPath();
  ctx.moveTo(cx, cy - s*3.5*dir);
  ctx.lineTo(cx, cy + s*3*dir);
  ctx.stroke();
  // Head
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(cx, cy - s*3*dir, s*2, s*1.5, 0, 0, Math.PI*2);
  ctx.fill();
  // Mandibles/claws
  ctx.strokeStyle = '#ffccaa';
  ctx.lineWidth = s*0.7;
  ctx.beginPath();
  ctx.moveTo(cx - s*1.5, cy - s*3.5*dir);
  ctx.lineTo(cx - s*3, cy - s*5.5*dir);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + s*1.5, cy - s*3.5*dir);
  ctx.lineTo(cx + s*3, cy - s*5.5*dir);
  ctx.stroke();
  // Eyes
  ctx.fillStyle = '#ffaa00';
  ctx.beginPath(); ctx.arc(cx - s*0.8, cy - s*3.5*dir, s*0.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*0.8, cy - s*3.5*dir, s*0.5, 0, Math.PI*2); ctx.fill();
  // Pointed tail
  ctx.fillStyle = shadeColor(color, -30);
  ctx.beginPath();
  ctx.moveTo(cx - s*0.8, cy + s*3*dir);
  ctx.lineTo(cx, cy + s*6*dir);
  ctx.lineTo(cx + s*0.8, cy + s*3*dir);
  ctx.closePath();
  ctx.fill();
}

function drawRoach(cx, cy, r, dir, color, anim) {
  const s = r / 10;
  // Six legs (three per side)
  ctx.strokeStyle = shadeColor(color, -50);
  ctx.lineWidth = s*1.2;
  const legMove = Math.sin(anim*6)*s*0.8;
  for (let i = -1; i <= 1; i++) {
    const ly = cy + i*s*3;
    ctx.beginPath(); ctx.moveTo(cx - s*6, ly); ctx.lineTo(cx - s*9, ly - s*2*dir + legMove*(i+1)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + s*6, ly); ctx.lineTo(cx + s*9, ly - s*2*dir - legMove*(i+1)); ctx.stroke();
  }
  // Wide armored carapace
  ctx.fillStyle = shadeColor(color, -25);
  ctx.beginPath();
  ctx.ellipse(cx, cy, s*8, s*6, 0, 0, Math.PI*2);
  ctx.fill();
  // Carapace plates/ridges
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(cx, cy - s*1, s*6, s*4, 0, 0, Math.PI*2);
  ctx.fill();
  // Ridge lines
  ctx.strokeStyle = shadeColor(color, -40);
  ctx.lineWidth = s*0.6;
  ctx.beginPath();
  ctx.moveTo(cx - s*4, cy - s*2); ctx.lineTo(cx, cy - s*4); ctx.lineTo(cx + s*4, cy - s*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - s*3, cy); ctx.lineTo(cx, cy - s*2); ctx.lineTo(cx + s*3, cy);
  ctx.stroke();
  // Acid spit nozzle (front)
  ctx.fillStyle = '#66aa33';
  ctx.beginPath();
  ctx.moveTo(cx - s*2, cy - s*5*dir);
  ctx.lineTo(cx, cy - s*8*dir);
  ctx.lineTo(cx + s*2, cy - s*5*dir);
  ctx.closePath();
  ctx.fill();
  // Acid drip
  ctx.fillStyle = '#88cc44';
  const drip = Math.sin(anim*4)*s;
  ctx.beginPath(); ctx.arc(cx, cy - s*8*dir - drip, s*0.8, 0, Math.PI*2); ctx.fill();
  // Beady eyes
  ctx.fillStyle = '#ffcc00';
  ctx.beginPath(); ctx.arc(cx - s*2, cy - s*4*dir, s*0.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*2, cy - s*4*dir, s*0.8, 0, Math.PI*2); ctx.fill();
}

function drawHydralisk(cx, cy, r, dir, color, anim) {
  const s = r / 9;
  // Snake-like lower body segments
  ctx.fillStyle = shadeColor(color, -30);
  const segOff = Math.sin(anim*4)*s*0.5;
  ctx.beginPath();
  ctx.ellipse(cx + segOff, cy + s*4*dir, s*3, s*2.5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx - segOff*0.5, cy + s*7*dir, s*2.5, s*2, 0, 0, Math.PI*2);
  ctx.fill();
  // Segment lines
  ctx.strokeStyle = shadeColor(color, -50);
  ctx.lineWidth = s*0.5;
  ctx.beginPath();
  ctx.moveTo(cx - s*2.5 + segOff, cy + s*2.5*dir);
  ctx.lineTo(cx + s*2.5 + segOff, cy + s*2.5*dir);
  ctx.stroke();
  // Main body/torso
  ctx.fillStyle = shadeColor(color, -15);
  ctx.beginPath();
  ctx.ellipse(cx, cy, s*4, s*5, 0, 0, Math.PI*2);
  ctx.fill();
  // Body detail
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(cx, cy - s*1, s*3, s*3.5, 0, 0, Math.PI*2);
  ctx.fill();
  // Hood/crest (cobra-like, flaring out)
  ctx.fillStyle = shadeColor(color, 10);
  ctx.beginPath();
  ctx.moveTo(cx, cy - s*6*dir);
  ctx.quadraticCurveTo(cx - s*7, cy - s*3*dir, cx - s*5, cy - s*0.5*dir);
  ctx.lineTo(cx - s*2, cy);
  ctx.lineTo(cx + s*2, cy);
  ctx.lineTo(cx + s*5, cy - s*0.5*dir);
  ctx.quadraticCurveTo(cx + s*7, cy - s*3*dir, cx, cy - s*6*dir);
  ctx.fill();
  // Scythe arms
  ctx.strokeStyle = '#ddaa88';
  ctx.lineWidth = s*1.2;
  ctx.beginPath();
  ctx.moveTo(cx - s*3, cy + s*1);
  ctx.quadraticCurveTo(cx - s*7, cy - s*2*dir, cx - s*5, cy - s*5*dir);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + s*3, cy + s*1);
  ctx.quadraticCurveTo(cx + s*7, cy - s*2*dir, cx + s*5, cy - s*5*dir);
  ctx.stroke();
  // Spines on back
  ctx.strokeStyle = shadeColor(color, 30);
  ctx.lineWidth = s*0.8;
  for (let i = 0; i < 3; i++) {
    const sy = cy + s*(i*2 - 1);
    ctx.beginPath(); ctx.moveTo(cx - s*1, sy); ctx.lineTo(cx - s*3, sy - s*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + s*1, sy); ctx.lineTo(cx + s*3, sy - s*2); ctx.stroke();
  }
  // Eyes
  ctx.fillStyle = '#ffaa00';
  ctx.beginPath(); ctx.arc(cx - s*1.5, cy - s*4*dir, s*0.7, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*1.5, cy - s*4*dir, s*0.7, 0, Math.PI*2); ctx.fill();
  // Mouth/jaw
  ctx.strokeStyle = '#ddccaa';
  ctx.lineWidth = s*0.6;
  ctx.beginPath();
  ctx.moveTo(cx - s*1, cy - s*5*dir);
  ctx.lineTo(cx, cy - s*6.5*dir);
  ctx.lineTo(cx + s*1, cy - s*5*dir);
  ctx.stroke();
}

function drawBaneling(cx, cy, r, dir, color, anim) {
  const s = r / 7;
  // Small tucked legs
  ctx.fillStyle = '#336633';
  const legA = anim*6;
  for (let i = 0; i < 4; i++) {
    const angle = (i/4)*Math.PI*2 + legA*0.3;
    const lx = cx + Math.cos(angle)*s*5;
    const ly = cy + Math.sin(angle)*s*4;
    ctx.beginPath(); ctx.arc(lx, ly, s*1, 0, Math.PI*2); ctx.fill();
  }
  // Outer acid sac membrane
  const pulse = Math.sin(anim*4)*s*0.8;
  ctx.fillStyle = 'rgba(80,200,80,0.2)';
  ctx.beginPath(); ctx.arc(cx, cy, s*7 + pulse, 0, Math.PI*2); ctx.fill();
  // Main acid sac body
  const grad = ctx.createRadialGradient(cx - s*1, cy - s*1, s*1, cx, cy, s*6);
  grad.addColorStop(0, '#88ff44');
  grad.addColorStop(0.5, '#44cc22');
  grad.addColorStop(1, '#227711');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(cx, cy, s*6, 0, Math.PI*2); ctx.fill();
  // Vein-like surface detail
  ctx.strokeStyle = 'rgba(30,100,20,0.5)';
  ctx.lineWidth = s*0.5;
  ctx.beginPath();
  ctx.moveTo(cx - s*3, cy - s*4); ctx.quadraticCurveTo(cx, cy - s*1, cx + s*2, cy - s*5);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - s*4, cy + s*1); ctx.quadraticCurveTo(cx - s*1, cy + s*2, cx + s*3, cy + s*3);
  ctx.stroke();
  // Inner glow (pulsing)
  const innerPulse = Math.sin(anim*6)*s*0.5 + s*2;
  ctx.fillStyle = 'rgba(180,255,100,0.4)';
  ctx.beginPath(); ctx.arc(cx, cy - s*0.5, innerPulse, 0, Math.PI*2); ctx.fill();
  // Acid drip effect
  ctx.fillStyle = '#66dd22';
  const dripY = Math.sin(anim*3)*s*1;
  ctx.beginPath(); ctx.arc(cx - s*2, cy + s*5 + dripY, s*0.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*1, cy + s*5.5 - dripY, s*0.6, 0, Math.PI*2); ctx.fill();
}

function drawUltralisk(cx, cy, r, dir, color, anim) {
  const s = r / 16;
  // Thick legs
  ctx.fillStyle = shadeColor(color, -50);
  ctx.fillRect(cx - s*10, cy + s*4*dir, s*4, s*7*dir);
  ctx.fillRect(cx + s*6, cy + s*4*dir, s*4, s*7*dir);
  ctx.fillRect(cx - s*6, cy + s*6*dir, s*3, s*6*dir);
  ctx.fillRect(cx + s*3, cy + s*6*dir, s*3, s*6*dir);
  // Huge oval body
  ctx.fillStyle = shadeColor(color, -25);
  ctx.beginPath();
  ctx.ellipse(cx, cy, s*12, s*8, 0, 0, Math.PI*2);
  ctx.fill();
  // Carapace with ridge plates
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(cx, cy - s*1, s*10, s*6, 0, 0, Math.PI*2);
  ctx.fill();
  // Ridge plate lines
  ctx.strokeStyle = shadeColor(color, 25);
  ctx.lineWidth = s*1;
  ctx.beginPath();
  ctx.moveTo(cx, cy - s*6); ctx.lineTo(cx, cy + s*4);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - s*7, cy - s*2); ctx.lineTo(cx - s*3, cy - s*5); ctx.lineTo(cx, cy - s*6);
  ctx.lineTo(cx + s*3, cy - s*5); ctx.lineTo(cx + s*7, cy - s*2);
  ctx.stroke();
  // Small head with tusks
  ctx.fillStyle = shadeColor(color, -10);
  ctx.beginPath();
  ctx.ellipse(cx, cy - s*7*dir, s*4, s*3, 0, 0, Math.PI*2);
  ctx.fill();
  // Tusks
  ctx.fillStyle = '#eeddcc';
  ctx.lineWidth = s*0.8;
  ctx.beginPath();
  ctx.moveTo(cx - s*2, cy - s*8*dir);
  ctx.lineTo(cx - s*4, cy - s*11*dir);
  ctx.lineTo(cx - s*1, cy - s*9*dir);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + s*2, cy - s*8*dir);
  ctx.lineTo(cx + s*4, cy - s*11*dir);
  ctx.lineTo(cx + s*1, cy - s*9*dir);
  ctx.closePath();
  ctx.fill();
  // Eyes
  ctx.fillStyle = '#ff4400';
  ctx.beginPath(); ctx.arc(cx - s*1.5, cy - s*7.5*dir, s*0.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + s*1.5, cy - s*7.5*dir, s*0.8, 0, Math.PI*2); ctx.fill();
  // Kaiser blades (4 massive curved blades, 2 per side)
  ctx.fillStyle = '#ddccbb';
  ctx.strokeStyle = '#bbaa99';
  ctx.lineWidth = s*0.6;
  // Left upper blade
  ctx.beginPath();
  ctx.moveTo(cx - s*10, cy - s*2);
  ctx.quadraticCurveTo(cx - s*16, cy - s*8*dir, cx - s*12, cy - s*12*dir);
  ctx.lineTo(cx - s*10, cy - s*8*dir);
  ctx.quadraticCurveTo(cx - s*13, cy - s*5*dir, cx - s*9, cy - s*1);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // Left lower blade
  ctx.beginPath();
  ctx.moveTo(cx - s*10, cy + s*1);
  ctx.quadraticCurveTo(cx - s*15, cy - s*4*dir, cx - s*11, cy - s*9*dir);
  ctx.lineTo(cx - s*9, cy - s*6*dir);
  ctx.quadraticCurveTo(cx - s*12, cy - s*2*dir, cx - s*9, cy + s*2);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // Right upper blade
  ctx.beginPath();
  ctx.moveTo(cx + s*10, cy - s*2);
  ctx.quadraticCurveTo(cx + s*16, cy - s*8*dir, cx + s*12, cy - s*12*dir);
  ctx.lineTo(cx + s*10, cy - s*8*dir);
  ctx.quadraticCurveTo(cx + s*13, cy - s*5*dir, cx + s*9, cy - s*1);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // Right lower blade
  ctx.beginPath();
  ctx.moveTo(cx + s*10, cy + s*1);
  ctx.quadraticCurveTo(cx + s*15, cy - s*4*dir, cx + s*11, cy - s*9*dir);
  ctx.lineTo(cx + s*9, cy - s*6*dir);
  ctx.quadraticCurveTo(cx + s*12, cy - s*2*dir, cx + s*9, cy + s*2);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
}

function drawDroneUnit(cx, cy, r, dir, color, anim) {
  const s = r / 8;
  // Hover shadow
  ctx.fillStyle = 'rgba(200,100,50,0.15)';
  ctx.beginPath(); ctx.ellipse(cx, cy + s*5, s*5, s*1.5, 0, 0, Math.PI*2); ctx.fill();
  // Wings (two pairs, angled back)
  ctx.fillStyle = shadeColor(color, -20);
  const wingFlap = Math.sin(anim*8)*s*0.5;
  // Upper wings
  ctx.beginPath();
  ctx.moveTo(cx - s*2, cy - s*1);
  ctx.lineTo(cx - s*7, cy + s*3*dir + wingFlap);
  ctx.lineTo(cx - s*6, cy + s*5*dir + wingFlap);
  ctx.lineTo(cx - s*1, cy + s*1);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + s*2, cy - s*1);
  ctx.lineTo(cx + s*7, cy + s*3*dir - wingFlap);
  ctx.lineTo(cx + s*6, cy + s*5*dir - wingFlap);
  ctx.lineTo(cx + s*1, cy + s*1);
  ctx.closePath();
  ctx.fill();
  // Lower wings (smaller)
  ctx.fillStyle = shadeColor(color, -35);
