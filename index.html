<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>StarClash - StarCraft Mobile Arena</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
canvas { display: block; }
#gameContainer {
  width: 100%; height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}
#menuScreen, #factionScreen, #gameOverScreen {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  z-index: 10;
}
#menuScreen { background: linear-gradient(180deg, #0a0a2e 0%, #1a0a3e 50%, #0a0a2e 100%); }
#factionScreen { background: linear-gradient(180deg, #0a0a2e 0%, #1a0a3e 50%, #0a0a2e 100%); display: none; }
#gameOverScreen { background: rgba(0,0,0,0.85); display: none; }
.title {
  font-size: 2.5em; color: #00d4ff;
  text-shadow: 0 0 20px #00d4ff, 0 0 40px #0066ff;
  margin-bottom: 10px; font-weight: bold;
  letter-spacing: 3px;
}
.subtitle {
  font-size: 1em; color: #8888cc;
  margin-bottom: 40px; letter-spacing: 2px;
}
.menuBtn {
  background: linear-gradient(180deg, #1a3a6a, #0a1a3a);
  border: 2px solid #00d4ff;
  color: #00d4ff; padding: 15px 50px;
  font-size: 1.2em; border-radius: 8px;
  margin: 8px; cursor: pointer;
  text-shadow: 0 0 10px #00d4ff;
  transition: all 0.2s;
  min-width: 220px; text-align: center;
}
.menuBtn:active { background: #00d4ff; color: #000; }
.factionCard {
  background: linear-gradient(180deg, #1a2a4a, #0a1a2a);
  border: 2px solid #446;
  border-radius: 12px; padding: 20px;
  margin: 10px; cursor: pointer;
  width: 85%; max-width: 300px;
  text-align: center; transition: all 0.2s;
}
.factionCard:active { border-color: #00d4ff; transform: scale(1.03); }
.factionCard h3 { font-size: 1.3em; margin-bottom: 5px; }
.factionCard p { font-size: 0.8em; color: #888; }
.fc-terran h3 { color: #4488ff; }
.fc-protoss h3 { color: #ffcc00; }
.fc-zerg h3 { color: #ff4444; }
.goText {
  font-size: 2em; margin-bottom: 20px;
  font-weight: bold;
}
.win { color: #00ff88; text-shadow: 0 0 20px #00ff88; }
.lose { color: #ff4444; text-shadow: 0 0 20px #ff4444; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="menuScreen">
    <div class="title">STARCLASH</div>
    <div class="subtitle">MOBILE ARENA</div>
    <div class="menuBtn" onclick="showFactionSelect()">BATTLE</div>
  </div>
  <div id="factionScreen">
    <div class="title" style="font-size:1.5em; margin-bottom:20px;">CHOOSE YOUR RACE</div>
    <div class="factionCard fc-terran" onclick="startGame('terran')">
      <h3>TERRAN</h3>
      <p>Versatile human forces. Marines, Siege Tanks, Medics.</p>
    </div>
    <div class="factionCard fc-protoss" onclick="startGame('protoss')">
      <h3>PROTOSS</h3>
      <p>Powerful psionic warriors. Zealots, Stalkers, High Templar.</p>
    </div>
    <div class="factionCard fc-zerg" onclick="startGame('zerg')">
      <h3>ZERG</h3>
      <p>Overwhelming swarm. Zerglings, Roaches, Hydralisks.</p>
    </div>
  </div>
  <div id="gameOverScreen">
    <div class="goText" id="goText">VICTORY</div>
    <div class="menuBtn" onclick="showMenu()">MAIN MENU</div>
    <div class="menuBtn" onclick="showFactionSelect()">PLAY AGAIN</div>
  </div>
</div>

<script>
// ============================================================
// STARCLASH - A StarCraft x Clash Royale mobile arena game
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ---- Layout ----
let W, H, SCALE;
const GAME_W = 400;
const GAME_H = 700;

function resize() {
  const ratio = GAME_W / GAME_H;
  if (window.innerWidth / window.innerHeight > ratio) {
    H = window.innerHeight;
    W = H * ratio;
  } else {
    W = window.innerWidth;
    H = W / ratio;
  }
  canvas.width = W;
  canvas.height = H;
  SCALE = W / GAME_W;
}
window.addEventListener('resize', resize);
resize();

// ---- Game State ----
let gameRunning = false;
let gameTime = 0;
let playerFaction = 'terran';
let enemyFaction = 'zerg';

const FACTIONS = ['terran', 'protoss', 'zerg'];
const FACTION_COLORS = {
  terran: { primary: '#4488ff', dark: '#223366', light: '#66aaff' },
  protoss: { primary: '#ffcc00', dark: '#665500', light: '#ffee66' },
  zerg: { primary: '#ff4444', dark: '#662222', light: '#ff8888' }
};

// ---- Arena Layout ----
// Two lanes with bridges over a river in the middle
const RIVER_Y = GAME_H * 0.43;
const RIVER_H = 18;
const BRIDGE_W = 70;
const LANE_X = [GAME_W * 0.28, GAME_W * 0.72];

// Towers / Bases
const TOWER_R = 22;
const BASE_R = 28;

function makeTowers() {
  return {
    player: {
      left:  { x: LANE_X[0], y: GAME_H - 100, hp: 1200, maxHp: 1200, r: TOWER_R },
      right: { x: LANE_X[1], y: GAME_H - 100, hp: 1200, maxHp: 1200, r: TOWER_R },
      base:  { x: GAME_W / 2, y: GAME_H - 45,  hp: 2400, maxHp: 2400, r: BASE_R }
    },
    enemy: {
      left:  { x: LANE_X[0], y: 100, hp: 1200, maxHp: 1200, r: TOWER_R },
      right: { x: LANE_X[1], y: 100, hp: 1200, maxHp: 1200, r: TOWER_R },
      base:  { x: GAME_W / 2, y: 45,  hp: 2400, maxHp: 2400, r: BASE_R }
    }
  };
}

let towers;

// ---- Minerals (Elixir equivalent) ----
let playerMinerals = 5;
let enemyMinerals = 5;
const MAX_MINERALS = 10;
const MINERAL_RATE = 0.4; // per second

// ---- Unit Definitions ----
const UNIT_DEFS = {
  // TERRAN
  marine:       { faction:'terran', cost:3, hp:280, dmg:35, speed:1.3, range:120, atkSpeed:0.8, count:3, r:8,  color:'#4488ff', name:'Marine' },
  marauder:     { faction:'terran', cost:4, hp:500, dmg:55, speed:1.0, range:90,  atkSpeed:1.0, count:2, r:10, color:'#336699', name:'Marauder' },
  medic:        { faction:'terran', cost:3, hp:200, dmg:0,  speed:1.2, range:100, atkSpeed:1.5, count:2, r:8,  color:'#88ccff', name:'Medic', healer:true, healAmt:40 },
  siegetank:    { faction:'terran', cost:6, hp:600, dmg:120,speed:0.5, range:160, atkSpeed:2.0, count:1, r:14, color:'#2255aa', name:'Siege Tank', splash:30 },
  ghost:        { faction:'terran', cost:5, hp:350, dmg:80, speed:1.1, range:140, atkSpeed:1.2, count:1, r:9,  color:'#aaccff', name:'Ghost' },
  scv:          { faction:'terran', cost:2, hp:200, dmg:0,  speed:1.0, range:0,   atkSpeed:0,   count:1, r:8,  color:'#88aadd', name:'SCV', worker:true, mineRate:0.3 },
  // PROTOSS
  zealot:       { faction:'protoss', cost:3, hp:400, dmg:50, speed:1.4, range:20,  atkSpeed:0.7, count:2, r:10, color:'#ffcc00', name:'Zealot' },
  stalker:      { faction:'protoss', cost:4, hp:350, dmg:45, speed:1.2, range:130, atkSpeed:0.9, count:2, r:9,  color:'#cc9900', name:'Stalker' },
  sentry:       { faction:'protoss', cost:3, hp:250, dmg:25, speed:1.0, range:110, atkSpeed:1.0, count:2, r:8,  color:'#ffee88', name:'Sentry', shield:true, shieldAmt:100 },
  hightemplar:  { faction:'protoss', cost:6, hp:280, dmg:150,speed:0.7, range:130, atkSpeed:2.5, count:1, r:9,  color:'#ffff00', name:'High Templar', splash:50 },
  immortal:     { faction:'protoss', cost:5, hp:600, dmg:70, speed:0.8, range:100, atkSpeed:1.2, count:1, r:13, color:'#ddaa00', name:'Immortal' },
  probe:        { faction:'protoss', cost:2, hp:180, dmg:0,  speed:1.0, range:0,   atkSpeed:0,   count:1, r:8,  color:'#ddcc44', name:'Probe', worker:true, mineRate:0.3 },
  // ZERG
  zergling:     { faction:'zerg', cost:2, hp:150, dmg:25, speed:2.0, range:18,  atkSpeed:0.5, count:6, r:6,  color:'#ff4444', name:'Zergling' },
  roach:        { faction:'zerg', cost:3, hp:450, dmg:30, speed:1.0, range:80,  atkSpeed:0.9, count:2, r:10, color:'#aa3333', name:'Roach' },
  hydralisk:    { faction:'zerg', cost:4, hp:300, dmg:50, speed:1.1, range:130, atkSpeed:0.8, count:2, r:9,  color:'#ff6666', name:'Hydralisk' },
  baneling:     { faction:'zerg', cost:3, hp:120, dmg:200,speed:1.8, range:15,  atkSpeed:0.1, count:3, r:7,  color:'#44ff44', name:'Baneling', suicide:true, splash:35 },
  ultralisk:    { faction:'zerg', cost:7, hp:900, dmg:80, speed:0.9, range:22,  atkSpeed:1.0, count:1, r:16, color:'#cc2222', name:'Ultralisk', splash:25 },
  drone:        { faction:'zerg', cost:2, hp:160, dmg:0,  speed:1.0, range:0,   atkSpeed:0,   count:1, r:8,  color:'#dd6644', name:'Drone', worker:true, mineRate:0.3 },
};

const FACTION_CARDS = {
  terran:  ['marine','marauder','medic','siegetank','ghost','scv'],
  protoss: ['zealot','stalker','sentry','hightemplar','immortal','probe'],
  zerg:    ['zergling','roach','hydralisk','baneling','ultralisk','drone'],
};

// ---- Card Hand ----
let playerDeck = [];
let playerHand = []; // 4 cards
let nextCard = null;
let selectedCard = -1;

let enemyDeck = [];
let enemyHand = [];
let enemyNextCard = null;

// ---- Units ----
let units = [];
let particles = [];
let projectiles = [];

// ---- Shuffle ----
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function initDeck(faction) {
  const cards = FACTION_CARDS[faction];
  let deck = [];
  for (let i = 0; i < 4; i++) deck.push(...cards);
  return shuffle(deck);
}

function drawCard(deck) {
  if (deck.length === 0) return null;
  return deck.pop();
}

function initHand(deck) {
  const hand = [];
  for (let i = 0; i < 4; i++) hand.push(drawCard(deck));
  const next = drawCard(deck);
  return { hand, next };
}

// ---- Spawn Units ----
function spawnUnit(defName, x, y, team) {
  const def = UNIT_DEFS[defName];
  const spreadR = def.count > 1 ? 15 : 0;
  for (let i = 0; i < def.count; i++) {
    const ox = (Math.random() - 0.5) * spreadR * 2;
    const oy = (Math.random() - 0.5) * spreadR * 2;
    const shield = def.shield ? def.shieldAmt : 0;
    units.push({
      type: defName,
      team,
      x: x + ox,
      y: y + oy,
      hp: def.hp,
      maxHp: def.hp,
      shield,
      maxShield: shield,
      dmg: def.dmg,
      speed: def.speed,
      range: def.range,
      atkSpeed: def.atkSpeed,
      atkTimer: 0,
      r: def.r,
      color: team === 'player' ? FACTION_COLORS[playerFaction].primary : FACTION_COLORS[enemyFaction].primary,
      dead: false,
      healer: def.healer || false,
      healAmt: def.healAmt || 0,
      suicide: def.suicide || false,
      splash: def.splash || 0,
      worker: def.worker || false,
      mineRate: def.mineRate || 0,
      target: null,
      animFrame: 0,
    });
  }
}

// ---- Menu ----
function showMenu() {
  document.getElementById('menuScreen').style.display = 'flex';
  document.getElementById('factionScreen').style.display = 'none';
  document.getElementById('gameOverScreen').style.display = 'none';
  gameRunning = false;
}

function showFactionSelect() {
  document.getElementById('menuScreen').style.display = 'none';
  document.getElementById('factionScreen').style.display = 'flex';
  document.getElementById('gameOverScreen').style.display = 'none';
}

function startGame(faction) {
  playerFaction = faction;
  const others = FACTIONS.filter(f => f !== faction);
  enemyFaction = others[Math.floor(Math.random() * others.length)];

  document.getElementById('menuScreen').style.display = 'none';
  document.getElementById('factionScreen').style.display = 'none';
  document.getElementById('gameOverScreen').style.display = 'none';

  towers = makeTowers();
  units = [];
  particles = [];
  projectiles = [];
  playerMinerals = 5;
  enemyMinerals = 5;
  gameTime = 0;
  selectedCard = -1;

  playerDeck = initDeck(playerFaction);
  const ph = initHand(playerDeck);
  playerHand = ph.hand;
  nextCard = ph.next;

  enemyDeck = initDeck(enemyFaction);
  const eh = initHand(enemyDeck);
  enemyHand = eh.hand;
  enemyNextCard = eh.next;

  gameRunning = true;
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

// ---- Find Target ----
function dist(a, b) {
  return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
}

function findTarget(unit) {
  const isPlayer = unit.team === 'player';
  let best = null;
  let bestDist = Infinity;

  // Find closest enemy unit
  for (const u of units) {
    if (u.dead || u.team === unit.team) continue;
    // Healers only target friendly
    if (unit.healer) continue;
    const d = dist(unit, u);
    if (d < bestDist) { bestDist = d; best = u; }
  }

  // Healers: target injured friendly
  if (unit.healer) {
    bestDist = Infinity;
    for (const u of units) {
      if (u.dead || u.team !== unit.team || u === unit || u.healer) continue;
      if (u.hp >= u.maxHp) continue;
      const d = dist(unit, u);
      if (d < bestDist) { bestDist = d; best = u; }
    }
    return best;
  }

  // Check towers
  const enemyTowers = isPlayer ? towers.enemy : towers.player;
  for (const key of ['left', 'right', 'base']) {
    const t = enemyTowers[key];
    if (t.hp <= 0) continue;
    const d = dist(unit, t);
    if (d < bestDist) { bestDist = d; best = t; }
  }

  return best;
}

// ---- Game Logic Update ----
function updateGame(dt) {
  gameTime += dt;

  // Mineral generation (boosted by workers)
  let playerWorkerBoost = 0;
  let enemyWorkerBoost = 0;
  for (const u of units) {
    if (u.dead || !u.worker) continue;
    if (u.team === 'player') playerWorkerBoost += u.mineRate;
    else enemyWorkerBoost += u.mineRate;
  }
  const baseRate = gameTime > 120 ? MINERAL_RATE * 2 : MINERAL_RATE;
  playerMinerals = Math.min(MAX_MINERALS, playerMinerals + (baseRate + playerWorkerBoost) * dt);
  enemyMinerals = Math.min(MAX_MINERALS, enemyMinerals + (baseRate + enemyWorkerBoost) * dt);

  // AI
  updateEnemyAI(dt);

  // Units
  for (const unit of units) {
    if (unit.dead) continue;
    unit.animFrame += dt * 5;

    // Workers walk to base area and mine
    if (unit.worker) {
      const baseY = unit.team === 'player' ? GAME_H - 60 : 60;
      const baseX = GAME_W / 2;
      const d = dist(unit, { x: baseX, y: baseY });
      if (d > 25) {
        const angle = Math.atan2(baseY - unit.y, baseX - unit.x);
        unit.x += Math.cos(angle) * unit.speed * 50 * dt;
        unit.y += Math.sin(angle) * unit.speed * 50 * dt;
      } else {
        // Bob around the base area while mining
        unit.x += Math.sin(gameTime * 3 + unit.y) * 0.3;
        unit.y += Math.cos(gameTime * 2 + unit.x) * 0.3;
        // Sparkle effect for mining
        if (Math.random() < 0.03) {
          spawnParticle(unit.x + (Math.random() - 0.5) * 10, unit.y + (Math.random() - 0.5) * 10, '#44ccff', 2);
        }
      }
      continue;
    }

    const target = findTarget(unit);
    unit.target = target;

    if (target) {
      const d = dist(unit, target);
      const targetR = target.r || 0;

      if (d - targetR <= unit.range) {
        // Attack
        unit.atkTimer -= dt;
        if (unit.atkTimer <= 0) {
          unit.atkTimer = unit.atkSpeed;

          if (unit.healer) {
            target.hp = Math.min(target.maxHp, target.hp + unit.healAmt);
            spawnParticle(target.x, target.y, '#88ff88', 8);
          } else if (unit.suicide) {
            // Suicide unit
            if (unit.splash > 0) {
              dealSplash(unit.x, unit.y, unit.splash, unit.dmg, unit.team);
            } else {
              dealDamage(target, unit.dmg);
            }
            spawnParticle(unit.x, unit.y, '#44ff44', 20);
            unit.hp = 0;
            unit.dead = true;
          } else {
            if (unit.range > 40) {
              // Ranged: projectile
              projectiles.push({ x: unit.x, y: unit.y, tx: target.x, ty: target.y, dmg: unit.dmg, team: unit.team, speed: 250, color: unit.color, splash: unit.splash, target });
            } else {
              if (unit.splash > 0) {
                dealSplash(target.x, target.y, unit.splash, unit.dmg, unit.team);
              } else {
                dealDamage(target, unit.dmg);
              }
              spawnParticle(target.x, target.y, '#fff', 5);
            }
          }
        }
      } else {
        // Move toward target
        const angle = Math.atan2(target.y - unit.y, target.x - unit.x);
        const moveSpeed = unit.speed * 50;
        unit.x += Math.cos(angle) * moveSpeed * dt;
        unit.y += Math.sin(angle) * moveSpeed * dt;
      }
    } else {
      // No target, advance toward enemy base
      const isPlayer = unit.team === 'player';
      const targetY = isPlayer ? 45 : GAME_H - 45;
      if (Math.abs(unit.y - targetY) > 5) {
        const dir = targetY > unit.y ? 1 : -1;
        unit.y += dir * unit.speed * 50 * dt;
      }
    }
  }

  // Projectiles
  for (const p of projectiles) {
    const angle = Math.atan2(p.ty - p.y, p.tx - p.x);
    const dx = Math.cos(angle) * p.speed * dt;
    const dy = Math.sin(angle) * p.speed * dt;
    p.x += dx;
    p.y += dy;
    if (Math.abs(p.x - p.tx) < 10 && Math.abs(p.y - p.ty) < 10) {
      if (p.splash > 0) {
        dealSplash(p.tx, p.ty, p.splash, p.dmg, p.team);
      } else if (p.target) {
        dealDamage(p.target, p.dmg);
      }
      spawnParticle(p.tx, p.ty, p.color, 6);
      p.dead = true;
    }
  }
  projectiles = projectiles.filter(p => !p.dead);

  // Cleanup dead units
  units = units.filter(u => {
    if (u.hp <= 0 && !u.dead) {
      u.dead = true;
      spawnParticle(u.x, u.y, u.color, 10);
    }
    return !u.dead;
  });

  // Particles
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    p.alpha = Math.max(0, p.life / p.maxLife);
  }
  particles = particles.filter(p => p.life > 0);

  // Check win/lose
  if (towers.enemy.base.hp <= 0) { endGame(true); }
  if (towers.player.base.hp <= 0) { endGame(false); }

  // Time limit: 3 minutes
  if (gameTime > 180) {
    const playerTotal = towers.player.left.hp + towers.player.right.hp + towers.player.base.hp;
    const enemyTotal = towers.enemy.left.hp + towers.enemy.right.hp + towers.enemy.base.hp;
    endGame(playerTotal > enemyTotal);
  }
}

function dealDamage(target, dmg) {
  if (target.shield && target.shield > 0) {
    const absorbed = Math.min(target.shield, dmg);
    target.shield -= absorbed;
    dmg -= absorbed;
  }
  target.hp -= dmg;
  if (target.hp <= 0) {
    target.hp = 0;
    if (target.dead !== undefined) target.dead = true;
  }
}

function dealSplash(x, y, radius, dmg, attackerTeam) {
  for (const u of units) {
    if (u.dead || u.team === attackerTeam) continue;
    if (dist(u, { x, y }) <= radius) {
      dealDamage(u, dmg);
    }
  }
  // Also damage towers
  const enemyTowers = attackerTeam === 'player' ? towers.enemy : towers.player;
  for (const key of ['left', 'right', 'base']) {
    const t = enemyTowers[key];
    if (t.hp <= 0) continue;
    if (dist(t, { x, y }) <= radius + t.r) {
      t.hp -= dmg;
      if (t.hp < 0) t.hp = 0;
    }
  }
  spawnParticle(x, y, '#ffaa33', 15);
}

function spawnParticle(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 20 + Math.random() * 60;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.3 + Math.random() * 0.4,
      maxLife: 0.7,
      color,
      r: 1.5 + Math.random() * 2.5,
      alpha: 1,
    });
  }
}

// ---- Enemy AI ----
let aiTimer = 0;
function updateEnemyAI(dt) {
  aiTimer -= dt;
  if (aiTimer > 0) return;
  aiTimer = 1.5 + Math.random() * 2.5;

  // Find affordable card
  const affordable = [];
  for (let i = 0; i < enemyHand.length; i++) {
    const card = enemyHand[i];
    if (!card) continue;
    const def = UNIT_DEFS[card];
    if (def && def.cost <= enemyMinerals) {
      affordable.push(i);
    }
  }
  if (affordable.length === 0) return;

  const idx = affordable[Math.floor(Math.random() * affordable.length)];
  const card = enemyHand[idx];
  const def = UNIT_DEFS[card];

  // Pick lane
  const lane = Math.random() < 0.5 ? 0 : 1;
  const x = LANE_X[lane] + (Math.random() - 0.5) * 40;
  const y = 130 + Math.random() * 40;

  enemyMinerals -= def.cost;
  spawnUnit(card, x, y, 'enemy');

  // Refill hand
  enemyHand[idx] = enemyNextCard;
  enemyNextCard = drawCard(enemyDeck);
  if (!enemyNextCard) {
    enemyDeck = initDeck(enemyFaction);
    enemyNextCard = drawCard(enemyDeck);
  }
}

// ---- End Game ----
function endGame(won) {
  gameRunning = false;
  const goText = document.getElementById('goText');
  goText.textContent = won ? 'VICTORY!' : 'DEFEAT!';
  goText.className = 'goText ' + (won ? 'win' : 'lose');
  document.getElementById('gameOverScreen').style.display = 'flex';
}

// ---- Rendering ----
function render() {
  ctx.save();
  ctx.scale(SCALE, SCALE);

  // Background - arena
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, GAME_W, GAME_H);

  // Arena ground
  drawArena();

  // River
  drawRiver();

  // Towers
  drawTowers();

  // Units
  for (const u of units) {
    if (u.dead) continue;
    drawUnit(u);
  }

  // Projectiles
  for (const p of projectiles) {
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // HUD
  drawHUD();

  // Card hand
  drawCardHand();

  // Drop zone highlight
  if (selectedCard >= 0) {
    drawDropZone();
  }

  ctx.restore();
}

function drawArena() {
  // Ground tiles
  ctx.fillStyle = '#222244';
  ctx.fillRect(20, 20, GAME_W - 40, GAME_H - 20);

  // Grid lines
  ctx.strokeStyle = '#2a2a4e';
  ctx.lineWidth = 0.5;
  for (let x = 20; x < GAME_W - 20; x += 30) {
    ctx.beginPath(); ctx.moveTo(x, 20); ctx.lineTo(x, GAME_H - 10); ctx.stroke();
  }
  for (let y = 20; y < GAME_H; y += 30) {
    ctx.beginPath(); ctx.moveTo(20, y); ctx.lineTo(GAME_W - 20, y); ctx.stroke();
  }

  // Lane highlights
  ctx.fillStyle = 'rgba(255,255,255,0.02)';
  ctx.fillRect(LANE_X[0] - 50, 20, 100, GAME_H - 30);
  ctx.fillRect(LANE_X[1] - 50, 20, 100, GAME_H - 30);

  // Side walls
  ctx.fillStyle = '#333366';
  ctx.fillRect(0, 0, 20, GAME_H);
  ctx.fillRect(GAME_W - 20, 0, 20, GAME_H);
}

function drawRiver() {
  // Water
  const shimmer = Math.sin(gameTime * 2) * 0.1 + 0.4;
  ctx.fillStyle = `rgba(0, 100, 200, ${shimmer})`;
  ctx.fillRect(20, RIVER_Y, GAME_W - 40, RIVER_H);

  // Bridges
  ctx.fillStyle = '#444466';
  for (const lx of LANE_X) {
    ctx.fillRect(lx - BRIDGE_W / 2, RIVER_Y - 2, BRIDGE_W, RIVER_H + 4);
    ctx.strokeStyle = '#555588';
    ctx.lineWidth = 1;
    ctx.strokeRect(lx - BRIDGE_W / 2, RIVER_Y - 2, BRIDGE_W, RIVER_H + 4);
  }
}

function drawTower(t, teamColor, isBase) {
  if (t.hp <= 0) {
    // Destroyed
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r * 0.7, 0, Math.PI * 2);
    ctx.fill();
    return;
  }

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(t.x + 2, t.y + 3, t.r + 2, t.r * 0.6 + 2, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body
  const grad = ctx.createRadialGradient(t.x - 3, t.y - 3, 2, t.x, t.y, t.r);
  grad.addColorStop(0, isBase ? '#667788' : '#556677');
  grad.addColorStop(1, '#223344');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
  ctx.fill();

  // Team color ring
  ctx.strokeStyle = teamColor;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
  ctx.stroke();

  // HP bar
  const barW = t.r * 2.2;
  const hpFrac = t.hp / t.maxHp;
  ctx.fillStyle = '#111';
  ctx.fillRect(t.x - barW / 2, t.y - t.r - 10, barW, 5);
  ctx.fillStyle = hpFrac > 0.5 ? '#44dd44' : hpFrac > 0.25 ? '#ddaa00' : '#dd3333';
  ctx.fillRect(t.x - barW / 2, t.y - t.r - 10, barW * hpFrac, 5);

  // Icon
  ctx.fillStyle = teamColor;
  ctx.font = `bold ${isBase ? 14 : 11}px monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(isBase ? 'HQ' : 'T', t.x, t.y);
}

function drawTowers() {
  const pc = FACTION_COLORS[playerFaction].primary;
  const ec = FACTION_COLORS[enemyFaction].primary;

  drawTower(towers.player.left, pc, false);
  drawTower(towers.player.right, pc, false);
  drawTower(towers.player.base, pc, true);
  drawTower(towers.enemy.left, ec, false);
  drawTower(towers.enemy.right, ec, false);
  drawTower(towers.enemy.base, ec, true);
}

function drawUnit(u) {
  const bob = Math.sin(u.animFrame) * 1.5;
  const cx = u.x;
  const cy = u.y + bob;
  const r = u.r;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(cx + 1, cy + r * 0.5 + 1, r * 0.8, r * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Draw unit shape based on type
  drawUnitShape(u, cx, cy, r);

  // Outline
  ctx.strokeStyle = u.team === 'player' ? '#fff' : '#000';
  ctx.lineWidth = 1.2;
  drawUnitOutline(u, cx, cy, r);

  // Shield indicator (protoss)
  if (u.maxShield > 0 && u.shield > 0) {
    ctx.strokeStyle = 'rgba(100, 200, 255, 0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, r + 3, 0, Math.PI * 2 * (u.shield / u.maxShield));
    ctx.stroke();
  }

  // Unit icon/letter
  ctx.fillStyle = u.team === 'player' ? '#fff' : 'rgba(255,255,255,0.8)';
  ctx.font = `bold ${Math.max(7, r - 1)}px monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const icon = getUnitIcon(u.type);
  ctx.fillText(icon, cx, cy);

  // HP bar
  if (u.hp < u.maxHp) {
    const barW = r * 2.4;
    const hpFrac = u.hp / u.maxHp;
    ctx.fillStyle = '#000';
    ctx.fillRect(cx - barW / 2, cy - r - 8, barW, 3);
    ctx.fillStyle = hpFrac > 0.5 ? '#44dd44' : hpFrac > 0.25 ? '#ddaa00' : '#dd3333';
    ctx.fillRect(cx - barW / 2, cy - r - 8, barW * hpFrac, 3);
  }
}

function getUnitIcon(type) {
  const icons = {
    marine: 'M', marauder: 'R', medic: '+', siegetank: 'S', ghost: 'G', scv: 'W',
    zealot: 'Z', stalker: 'K', sentry: 'N', hightemplar: 'H', immortal: 'I', probe: 'W',
    zergling: 'z', roach: 'r', hydralisk: 'h', baneling: 'b', ultralisk: 'U', drone: 'W',
  };
  return icons[type] || '?';
}

function drawUnitShape(u, cx, cy, r) {
  ctx.fillStyle = u.color;
  switch (u.type) {
    // --- TERRAN ---
    case 'marine': // Circle
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      break;
    case 'marauder': // Rounded square (big & beefy)
      roundRect(ctx, cx - r, cy - r, r * 2, r * 2, 4, true, false);
      break;
    case 'medic': // Circle with cross aura
      ctx.fillStyle = '#225588';
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = u.color;
      ctx.fillRect(cx - r * 0.6, cy - r * 0.2, r * 1.2, r * 0.4);
      ctx.fillRect(cx - r * 0.2, cy - r * 0.6, r * 0.4, r * 1.2);
      break;
    case 'siegetank': // Wide rectangle (tank treads)
      ctx.fillRect(cx - r * 1.1, cy - r * 0.7, r * 2.2, r * 1.4);
      // Barrel
      ctx.fillStyle = '#445577';
      ctx.fillRect(cx - 2, cy - r * 0.9, 4, r * 0.6);
      break;
    case 'ghost': // Diamond (stealthy)
      ctx.beginPath();
      ctx.moveTo(cx, cy - r);
      ctx.lineTo(cx + r * 0.8, cy);
      ctx.lineTo(cx, cy + r);
      ctx.lineTo(cx - r * 0.8, cy);
      ctx.closePath();
      ctx.fill();
      break;
    case 'scv': // Pentagon (worker)
      drawPolygon(ctx, cx, cy, r, 5, u.color);
      break;
    // --- PROTOSS ---
    case 'zealot': // Triangle pointing forward (aggressive melee)
      ctx.beginPath();
      if (u.team === 'player') {
        ctx.moveTo(cx, cy - r);
        ctx.lineTo(cx + r, cy + r * 0.8);
        ctx.lineTo(cx - r, cy + r * 0.8);
      } else {
        ctx.moveTo(cx, cy + r);
        ctx.lineTo(cx + r, cy - r * 0.8);
        ctx.lineTo(cx - r, cy - r * 0.8);
      }
      ctx.closePath();
      ctx.fill();
      break;
    case 'stalker': // Tall diamond
      ctx.beginPath();
      ctx.moveTo(cx, cy - r * 1.1);
      ctx.lineTo(cx + r * 0.7, cy);
      ctx.lineTo(cx, cy + r * 1.1);
      ctx.lineTo(cx - r * 0.7, cy);
      ctx.closePath();
      ctx.fill();
      break;
    case 'sentry': // Hexagon (support/shield)
      drawPolygon(ctx, cx, cy, r, 6, u.color);
      break;
    case 'hightemplar': // Star shape (powerful caster)
      drawStar(ctx, cx, cy, r, u.color);
      break;
    case 'immortal': // Octagon (heavy/armored)
      drawPolygon(ctx, cx, cy, r, 8, u.color);
      break;
    case 'probe': // Small hexagon (worker)
      drawPolygon(ctx, cx, cy, r, 6, u.color);
      break;
    // --- ZERG ---
    case 'zergling': // Small triangle (fast swarm)
      ctx.beginPath();
      if (u.team === 'player') {
        ctx.moveTo(cx, cy - r * 0.9);
        ctx.lineTo(cx + r * 0.8, cy + r * 0.7);
        ctx.lineTo(cx - r * 0.8, cy + r * 0.7);
      } else {
        ctx.moveTo(cx, cy + r * 0.9);
        ctx.lineTo(cx + r * 0.8, cy - r * 0.7);
        ctx.lineTo(cx - r * 0.8, cy - r * 0.7);
      }
      ctx.closePath();
      ctx.fill();
      break;
    case 'roach': // Wide oval (tanky)
      ctx.beginPath();
      ctx.ellipse(cx, cy, r * 1.1, r * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();
      break;
    case 'hydralisk': // Tall oval with spines
      ctx.beginPath();
      ctx.ellipse(cx, cy, r * 0.7, r * 1.1, 0, 0, Math.PI * 2);
      ctx.fill();
      // Spines
      ctx.strokeStyle = u.color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.7, cy - r * 0.4); ctx.lineTo(cx - r * 1.1, cy - r * 0.9);
      ctx.moveTo(cx + r * 0.7, cy - r * 0.4); ctx.lineTo(cx + r * 1.1, cy - r * 0.9);
      ctx.stroke();
      break;
    case 'baneling': // Circle with spikes (explosive)
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      // Glow
      ctx.fillStyle = 'rgba(100, 255, 100, 0.3)';
      ctx.beginPath();
      ctx.arc(cx, cy, r + 3, 0, Math.PI * 2);
      ctx.fill();
      break;
    case 'ultralisk': // Large rounded rect with horns
      roundRect(ctx, cx - r, cy - r * 0.8, r * 2, r * 1.6, 5, true, false);
      // Horns (kaiser blades)
      ctx.fillStyle = '#ffccaa';
      ctx.beginPath();
      ctx.moveTo(cx - r, cy - r * 0.5);
      ctx.lineTo(cx - r * 1.4, cy - r * 1.2);
      ctx.lineTo(cx - r * 0.5, cy - r * 0.3);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx + r, cy - r * 0.5);
      ctx.lineTo(cx + r * 1.4, cy - r * 1.2);
      ctx.lineTo(cx + r * 0.5, cy - r * 0.3);
      ctx.closePath();
      ctx.fill();
      break;
    case 'drone': // Pentagon (worker)
      drawPolygon(ctx, cx, cy, r, 5, u.color);
      break;
    default:
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
  }
}

function drawUnitOutline(u, cx, cy, r) {
  switch (u.type) {
    case 'marauder':
      roundRect(ctx, cx - r, cy - r, r * 2, r * 2, 4, false, true);
      break;
    case 'siegetank':
      ctx.strokeRect(cx - r * 1.1, cy - r * 0.7, r * 2.2, r * 1.4);
      break;
    case 'ghost': case 'stalker':
      ctx.beginPath();
      if (u.type === 'ghost') {
        ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r * 0.8, cy);
        ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r * 0.8, cy);
      } else {
        ctx.moveTo(cx, cy - r * 1.1); ctx.lineTo(cx + r * 0.7, cy);
        ctx.lineTo(cx, cy + r * 1.1); ctx.lineTo(cx - r * 0.7, cy);
      }
      ctx.closePath(); ctx.stroke();
      break;
    case 'zealot': case 'zergling':
      // Triangle outlines handled by default arc
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.9, 0, Math.PI * 2); ctx.stroke();
      break;
    case 'roach':
      ctx.beginPath(); ctx.ellipse(cx, cy, r * 1.1, r * 0.8, 0, 0, Math.PI * 2); ctx.stroke();
      break;
    case 'hydralisk':
      ctx.beginPath(); ctx.ellipse(cx, cy, r * 0.7, r * 1.1, 0, 0, Math.PI * 2); ctx.stroke();
      break;
    case 'ultralisk':
      roundRect(ctx, cx - r, cy - r * 0.8, r * 2, r * 1.6, 5, false, true);
      break;
    default:
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  }
}

function drawPolygon(ctx, cx, cy, r, sides, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < sides; i++) {
    const angle = (Math.PI * 2 / sides) * i - Math.PI / 2;
    const px = cx + Math.cos(angle) * r;
    const py = cy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
}

function drawStar(ctx, cx, cy, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const angle = (Math.PI * 2 / 10) * i - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.5;
    const px = cx + Math.cos(angle) * rad;
    const py = cy + Math.sin(angle) * rad;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
}

function drawHUD() {
  // Top bar - enemy info
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, GAME_W, 20);
  ctx.fillStyle = FACTION_COLORS[enemyFaction].primary;
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`ENEMY: ${enemyFaction.toUpperCase()}`, 6, 14);

  // Timer
  const remaining = Math.max(0, 180 - gameTime);
  const min = Math.floor(remaining / 60);
  const sec = Math.floor(remaining % 60);
  ctx.fillStyle = remaining < 30 ? '#ff4444' : '#fff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 12px monospace';
  ctx.fillText(`${min}:${sec < 10 ? '0' : ''}${sec}`, GAME_W / 2, 14);

  // Player faction
  ctx.fillStyle = FACTION_COLORS[playerFaction].primary;
  ctx.textAlign = 'right';
  ctx.font = 'bold 11px monospace';
  ctx.fillText(playerFaction.toUpperCase(), GAME_W - 6, 14);
}

// ---- Card Hand ----
const CARD_H = 90;
const CARD_W = 68;
const CARD_Y = GAME_H - CARD_H - 10;

function drawCardHand() {
  // Card tray background
  ctx.fillStyle = 'rgba(0,0,10,0.85)';
  ctx.fillRect(0, CARD_Y - 30, GAME_W, CARD_H + 45);

  // Mineral bar
  const barY = CARD_Y - 24;
  ctx.fillStyle = '#0a0a20';
  ctx.fillRect(10, barY, GAME_W - 20, 16);
  const frac = playerMinerals / MAX_MINERALS;
  const mColor = playerFaction === 'protoss' ? '#ffcc00' : playerFaction === 'zerg' ? '#ff4444' : '#4488ff';
  ctx.fillStyle = mColor;
  ctx.fillRect(10, barY, (GAME_W - 20) * frac, 16);
  ctx.strokeStyle = '#445';
  ctx.lineWidth = 1;
  ctx.strokeRect(10, barY, GAME_W - 20, 16);

  // Mineral text
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`MINERALS: ${Math.floor(playerMinerals)} / ${MAX_MINERALS}`, GAME_W / 2, barY + 12);

  // Cards
  const totalW = 4 * CARD_W + 3 * 8;
  const startX = (GAME_W - totalW) / 2;

  for (let i = 0; i < 4; i++) {
    const card = playerHand[i];
    if (!card) continue;
    const def = UNIT_DEFS[card];
    const cx = startX + i * (CARD_W + 8);
    const cy = CARD_Y;
    const affordable = def.cost <= playerMinerals;
    const selected = selectedCard === i;

    // Card bg
    const cColor = FACTION_COLORS[def.faction];
    if (selected) {
      ctx.fillStyle = cColor.primary;
      ctx.shadowColor = cColor.primary;
      ctx.shadowBlur = 12;
    } else if (affordable) {
      ctx.fillStyle = cColor.dark;
    } else {
      ctx.fillStyle = '#1a1a1a';
    }
    roundRect(ctx, cx, cy, CARD_W, CARD_H, 8, true, false);
    ctx.shadowBlur = 0;

    // Border
    ctx.strokeStyle = selected ? '#fff' : (affordable ? cColor.primary : '#333');
    ctx.lineWidth = selected ? 2 : 1;
    roundRect(ctx, cx, cy, CARD_W, CARD_H, 8, false, true);

    // Unit circle
    const unitColor = affordable ? def.color : '#555';
    ctx.fillStyle = unitColor;
    ctx.beginPath();
    ctx.arc(cx + CARD_W / 2, cy + 30, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = affordable ? '#fff' : '#444';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx + CARD_W / 2, cy + 30, 14, 0, Math.PI * 2);
    ctx.stroke();

    // Count
    if (def.count > 1) {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`x${def.count}`, cx + CARD_W / 2, cy + 34);
    }

    // Name
    ctx.fillStyle = affordable ? '#fff' : '#666';
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(def.name, cx + CARD_W / 2, cy + 56);

    // Cost
    ctx.fillStyle = affordable ? '#88ccff' : '#444';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(def.cost, cx + CARD_W / 2, cy + 74);

    // Stat line
    ctx.fillStyle = affordable ? '#888' : '#444';
    ctx.font = '7px monospace';
    ctx.fillText(`${def.hp}hp ${def.dmg}dmg`, cx + CARD_W / 2, cy + 85);
  }

  // Next card preview
  if (nextCard) {
    const def = UNIT_DEFS[nextCard];
    ctx.fillStyle = '#333';
    ctx.font = '8px monospace';
    ctx.textAlign = 'right';
    ctx.fillText('NEXT:', GAME_W - 15, CARD_Y + 12);
    ctx.fillStyle = def.color;
    ctx.beginPath();
    ctx.arc(GAME_W - 15, CARD_Y + 26, 8, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawDropZone() {
  // Highlight valid drop area (player side)
  ctx.fillStyle = 'rgba(0, 200, 255, 0.08)';
  ctx.fillRect(20, RIVER_Y + RIVER_H, GAME_W - 40, CARD_Y - 30 - RIVER_Y - RIVER_H);
  ctx.strokeStyle = 'rgba(0, 200, 255, 0.3)';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  ctx.strokeRect(20, RIVER_Y + RIVER_H, GAME_W - 40, CARD_Y - 30 - RIVER_Y - RIVER_H);
  ctx.setLineDash([]);
}

function roundRect(ctx, x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

// ---- Touch / Input ----
let touchStartY = 0;
let dragUnit = false;

function gameToCanvas(tx, ty) {
  const rect = canvas.getBoundingClientRect();
  const cx = (tx - rect.left) / SCALE;
  const cy = (ty - rect.top) / SCALE;
  return { x: cx, y: cy };
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (!gameRunning) return;
  const touch = e.touches[0];
  const { x, y } = gameToCanvas(touch.clientX, touch.clientY);

  // Check if tapping a card
  const totalW = 4 * CARD_W + 3 * 8;
  const startX = (GAME_W - totalW) / 2;
  for (let i = 0; i < 4; i++) {
    const cx = startX + i * (CARD_W + 8);
    if (x >= cx && x <= cx + CARD_W && y >= CARD_Y && y <= CARD_Y + CARD_H) {
      const card = playerHand[i];
      if (!card) return;
      const def = UNIT_DEFS[card];
      if (def.cost <= playerMinerals) {
        selectedCard = selectedCard === i ? -1 : i;
      }
      return;
    }
  }

  // If a card is selected and tapping the arena
  if (selectedCard >= 0) {
    // Only allow placement on player side (below river)
    if (y > RIVER_Y + RIVER_H && y < CARD_Y - 35) {
      playCard(selectedCard, x, y);
    }
    selectedCard = -1;
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

// Mouse support for testing
canvas.addEventListener('mousedown', (e) => {
  if (!gameRunning) return;
  const { x, y } = gameToCanvas(e.clientX, e.clientY);

  const totalW = 4 * CARD_W + 3 * 8;
  const startX = (GAME_W - totalW) / 2;
  for (let i = 0; i < 4; i++) {
    const cx = startX + i * (CARD_W + 8);
    if (x >= cx && x <= cx + CARD_W && y >= CARD_Y && y <= CARD_Y + CARD_H) {
      const card = playerHand[i];
      if (!card) return;
      const def = UNIT_DEFS[card];
      if (def.cost <= playerMinerals) {
        selectedCard = selectedCard === i ? -1 : i;
      }
      return;
    }
  }

  if (selectedCard >= 0) {
    if (y > RIVER_Y + RIVER_H && y < CARD_Y - 35) {
      playCard(selectedCard, x, y);
    }
    selectedCard = -1;
  }
});

function playCard(idx, x, y) {
  const card = playerHand[idx];
  if (!card) return;
  const def = UNIT_DEFS[card];
  if (def.cost > playerMinerals) return;

  playerMinerals -= def.cost;
  spawnUnit(card, x, y, 'player');

  // Refill hand
  playerHand[idx] = nextCard;
  nextCard = drawCard(playerDeck);
  if (!nextCard) {
    playerDeck = initDeck(playerFaction);
    nextCard = drawCard(playerDeck);
  }
}

// ---- Game Loop ----
let lastTime = 0;

function gameLoop(timestamp) {
  if (!gameRunning) return;

  const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
  lastTime = timestamp;

  updateGame(dt);
  render();

  requestAnimationFrame(gameLoop);
}

// Initial render
render();
</script>
